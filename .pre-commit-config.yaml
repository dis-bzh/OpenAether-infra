# Both hook types, so `pre-commit install` alone installs the commit-msg gates.
# Without this the message hooks are silently absent from a fresh clone.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Conventional Commits: the subject decides the CHANGELOG entry, so a subject
  # that does not parse is a release note nobody wrote. Same tool as CI.
  - repo: https://github.com/commitizen-tools/commitizen
    rev: 57217c394fff5064bedd48421fe4b6f5f73aad47  # v4.19.2
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # A model is not an author and cannot certify origin: CONTRIBUTING.md asks for
  # `Assisted-by:` instead. Rule adopted 2026-08; older commits are not rewritten.
  - repo: local
    hooks:
      # NOT pre-commit-terraform's terraform_tflint: it runs `--recursive` with
      # no config, and tflint resolves .tflint.hcl per directory — thirteen of
      # fourteen were linted bare and passed. Same script as `task lint`, so a
      # hook and CI cannot disagree.
      - id: tflint-all
        name: tflint (one config, every directory)
        language: system
        pass_filenames: false
        files: \.tf$
        entry: scripts/dev/tflint-all.sh

      - id: no-tool-authorship-trailer
        name: no Co-Authored-By / Signed-off-by from a tool
        language: system
        stages: [commit-msg]
        entry: scripts/dev/check-commit-trailers.sh

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-merge-conflict
      - id: detect-private-key

  # Secret detection. gitleaks-system, not the default `gitleaks` hook: that one
  # is `language: golang` and pre-commit builds it from source on first use —
  # which panics inside wasilibs/go-re2's WASM regex engine in this project's
  # sandbox (`invalid table access`, in wazero), reproduced across a full
  # go-build-cache wipe and two Go toolchains. gitleaks-system shells out to
  # the pinned, checksum-verified binary scripts/internal/install-gitleaks.sh
  # installs instead — the exact same version, built upstream, carries no
  # such defect. See #126.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks-system
        # Unlike its `gitleaks`/`gitleaks-docker` siblings, upstream's own
        # gitleaks-system hook omits this — so pre-commit's default (true)
        # appends every changed file as a positional arg, and gitleaks' `git`
        # subcommand accepts at most one ("accepts at most 1 arg(s), received
        # 60"). It scans the whole staged diff itself; it needs no filenames.
        pass_filenames: false

  # OpenTofu / Terraform formatting
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 80c8033123f6d6b9ccd1a9458562ea4180742af7  # v1.109.2
    hooks:
      # Per changed file's directory, not -recursive: from cluster/ it also
      # rewrote the gitignored envs/*.tfvars (#191). `files:` adds the test files
      # upstream skips; `task lint` fails unless it equals TF_FMT_RE in Taskfile.yml.
      - id: terraform_fmt
        files: \.(tf|tofu|tfvars|tftest\.hcl|tofutest\.hcl)$
        args: ["--hook-config=--tf-path=tofu"]
      - id: terraform_validate
        args: ["--hook-config=--retry-once-with-cleanup=true", "--hook-config=--tf-path=tofu"]

  # YAML linting (same config the CI uses)
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # v1.38.0
    hooks:
      - id: yamllint
        args: ["-c", "infrastructure/.yamllint"]
        files: \.(yaml|yml)$
