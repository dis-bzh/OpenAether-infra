# Every ref the repository serves, scanned for credentials and environment data (#341). The PR job reads what a pull
# request adds, security.yml the branch history; neither reads tags or the pull-request heads GitHub keeps after a
# purge. scripts/dev/scan-all-refs.sh says why and how; what to do with a finding: docs/incident-response.md, section 7.
name: History scan

on:
  schedule:
    # Weekly, off the hour (a shared runner pool is busiest at :00).
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: history-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    name: Scan every ref
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Install gitleaks (pinned + checksum-verified)
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.*)$
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${asset}" "${base}/${asset}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${asset}$" > checksums.txt
          sha256sum -c checksums.txt
          tar xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      # Before trusting the scan: it must catch a leak served only by a pull-request head or a tag.
      - name: The scan still catches what it claims
        run: ./scripts/dev/test-scan-all-refs.sh

      # Anonymous mirror clone of a public repository: no credential is needed or held.
      - name: Scan every ref
        env:
          REMOTE: ${{ github.server_url }}/${{ github.repository }}
        run: ./scripts/dev/scan-all-refs.sh "$REMOTE"
