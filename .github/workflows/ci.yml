name: CI

on:
  push:
    branches: [main]
  # No `branches` filter and `edited` added, both measured on PR #100: a PR
  # based on another PR's branch got NO run at all (not a red one — none), and
  # retargeting it to main fired only `edited`, which the default types skip.
  # An unvalidated stacked PR looks exactly like a green one in the list.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# All jobs here are read-only validation — always safe to cancel a superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A docs-only PR cannot break Terraform, Talos, or a real HTTP API — feint,
  # OpenTofu validate/test, and the Talos/IaC scans exist to catch mistakes IN
  # infrastructure code, and there is none in the diff to catch a mistake in.
  #
  # This job itself is NEVER skipped by its own `if:` (unlike the jobs it
  # gates) — on push it just short-circuits to code=true without a checkout.
  # Reason: `needs: changes` on a matrix job (validate, emulated) combined
  # with a skipped `changes` would fail those jobs' implicit success() gate
  # and skip them entirely — reintroducing the exact "required check never
  # reports" trap this whole job exists to avoid, just one hop upstream.
  #
  # Downstream gating happens two different ways depending on whether the
  # job is a matrix job, and this is not cosmetic — it's a GitHub Actions
  # limitation (actions/runner#952): a job-level `if:` that evaluates false
  # skips the job BEFORE its matrix expands, collapsing every combination
  # into ONE check reported under the job's raw, unexpanded name (e.g.
  # `Validate` instead of `Validate (cluster)` / `Validate (talos-image)`,
  # or literally `Emulated Cloud (${{ matrix.provider }})`). None of those
  # match the per-matrix required-check names branch protection expects, so
  # the PR sits "blocked" forever — measured live on PR #146, the first
  # genuinely docs-only PR to hit this path. So: non-matrix gated jobs
  # (manifests, test, talos, security) gate at the JOB level; matrix jobs
  # (validate, emulated) MUST gate at the STEP level instead, so the job
  # itself always runs, the matrix always fully expands, and every
  # per-combination check name always exists — just fast and empty when
  # code == 'false'.
  #
  # Errs toward "code": classifies by exclusion (docs/**, *.md, README*,
  # CHANGELOG.md, CONTRIBUTING.md, LICENSE), so any path this doesn't
  # recognise as documentation — a new top-level file type, say — runs the
  # full suite until someone deliberately adds it to the docs list below.
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify the diff
        id: classify
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/changed.txt"
          docs_pattern='^(docs/|README|CHANGELOG\.md$|CONTRIBUTING\.md$|LICENSE$|.*\.md$)'
          if grep -vEq "$docs_pattern" "$RUNNER_TEMP/changed.txt"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The commit-msg hooks that enforce this live in .git/hooks/, which no clone
  # carries — so the same checks run here on every subject a PR adds.
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          # cz needs the range, and the default single-commit checkout has none.
          fetch-depth: 0

      - name: Install commitizen
        # renovate: datasource=pypi depName=commitizen
        run: pip install commitizen==4.18.0

      - name: Conventional Commits
        run: cz check --rev-range origin/${{ github.base_ref }}..HEAD

      # The trailer check reads the message; this reads who git says wrote the
      # commit. GitHub builds the squash commit's `Co-authored-by` from the
      # BRANCH commits' authors, so by the time a message carries the trailer it
      # is already on main and no message check can refuse it. Seventeen commits
      # on main carry one. This is the only place it can still be caught.
      - name: No commit authored by a tool
        run: ./scripts/dev/check-commit-authors.sh "origin/${{ github.base_ref }}..HEAD"

      # Scoped by the tree, not by a date or a pinned sha: a commit is checked
      # only if the rule already existed in it. Commits predating the rule are
      # skipped rather than rewritten.
      - name: No authorship trailer naming a tool
        run: |
          check=scripts/dev/check-commit-trailers.sh
          for sha in $(git log --format=%H "origin/${{ github.base_ref }}..HEAD"); do
            git cat-file -e "$sha:$check" 2>/dev/null || continue
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            "./$check" "$RUNNER_TEMP/msg"
          done

  # Environment data — real IPs, account ids, bucket names — is what actually
  # leaked here, and the credential rules gitleaks ships do not look for it.
  # Scoped to what a PR ADDS, and the config is passed with -c rather than named
  # .gitleaks.toml, so the full-history scan in security.yml keeps its own scope:
  # these rules find 214 values in history and every one is a public resolver, a
  # synthetic fixture or a documented example. What matters is the next one.
  leaks:
    name: Environment data in new commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.*)$
          GITLEAKS_VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -O "${base}/${asset}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${asset}$" > checksums.txt
          sha256sum -c checksums.txt
          tar xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      # Before trusting the scan: a rule that matches nothing passes silently,
      # and two in this config did. See the script's header.
      - name: The rules still catch what they claim
        run: ./scripts/dev/check-gitleaks-rules.sh

      - name: Scan what this PR adds
        run: |
          gitleaks git -c .gitleaks-envdata.toml \
            --log-opts="origin/${{ github.base_ref }}..HEAD" -v --redact

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2
        with:
          # renovate: datasource=github-releases depName=opentofu/opentofu extractVersion=^v(?<version>.*)$
          tofu_version: "1.12.6"

      # Same installer as setup.sh and the session-start hook, for the same reason
      # as Task below: one pinned version, verified against the project's own
      # checksums, and no third-party action between us and the binary.
      - name: Setup TFLint
        run: ./scripts/internal/install-tflint.sh

      # Same installer as setup.sh, for the same reason as TFLint above.
      - name: Setup actionlint
        run: ./scripts/internal/install-actionlint.sh

      # Not `arduino/setup-task`: that action asks the releases API for the
      # version, UNAUTHENTICATED, from a runner IP shared with every other GitHub
      # customer — which is what took `main` red on 2026-08-13 with nothing wrong
      # in the code. Passing it a token would have hidden the second half: this
      # repository pins and checksums helm, gitleaks, feint and tflint, and Task
      # was the one tool coming from a third party by name. Same installer as
      # `scripts/setup.sh`, so a runner and a workstation cannot disagree.
      - name: Setup Task
        run: ./scripts/internal/install-task.sh

      - name: Install yamllint
        # renovate: datasource=pypi depName=yamllint
        run: pip install yamllint==1.38.0

      # `task lint` gates on shellcheck. The GitHub runner image is DOCUMENTED to
      # carry it, but "the image happens to ship it" is not a dependency — the
      # day it stops, a lint step disappears silently instead of failing. Same
      # reasoning as pinning Task above: a runner and a workstation must not
      # disagree about what is installed. Same installer as setup.sh (#113).
      - name: Setup shellcheck
        run: ./scripts/internal/install-shellcheck.sh

      - name: Validate Renovate config
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: "44.52.1"
        run: npx --yes -p "renovate@${RENOVATE_VERSION}" -- renovate-config-validator renovate.json5

      # flux-bootstrap.yaml.tftpl is read by nothing else here (#114) —
      # yamllint above is scoped to *.yaml/*.yml, and this is a .tftpl. Same
      # shape as the gitleaks install in the `leaks` job: pinned,
      # checksum-verified, no third party in the path.
      - name: Install Flux CLI (pinned + checksum-verified)
        env:
          # renovate: datasource=github-releases depName=fluxcd/flux2 extractVersion=^v(?<version>.*)$
          FLUX_VERSION: "2.9.5"
        run: |
          set -euo pipefail
          asset="flux_${FLUX_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}"
          curl -fsSL -O "${base}/${asset}"
          curl -fsSL "${base}/flux_${FLUX_VERSION}_checksums.txt" | grep " ${asset}\$" > checksums.txt
          sha256sum -c checksums.txt
          tar xzf "${asset}" flux
          sudo install -m 0755 flux /usr/local/bin/flux

      # `flux plugin install` downloads from Flux's own catalog with its OWN
      # checksum verification (fluxcd/flux2 RFC 0013) — the version pin below
      # is what Renovate/Cléa track, not a transit-integrity check we redo here.
      - name: Install flux-schema plugin
        env:
          # renovate: datasource=github-releases depName=fluxcd/flux-schema extractVersion=^v(?<version>.*)$
          FLUX_SCHEMA_VERSION: "0.12.1"
        run: flux plugin install "schema@${FLUX_SCHEMA_VERSION}"

      # One-time per-runner setup task itself doesn't need — tflint plugin init
      # is CI-specific (a fresh runner has no cached plugins); local dev covers
      # this via `task setup`.
      - name: tflint init
        # TFLINT_CONFIG_FILE, not the directory: tflint resolves .tflint.hcl per
        # directory, so `--init` in a directory that holds none initialises the
        # plugins of no config at all.
        run: TFLINT_CONFIG_FILE="$PWD/.tflint.hcl" tflint --init
        working-directory: infrastructure/opentofu

      - name: task lint
        run: task lint

  # `task render-check` existed but nothing ran it. Renovate bumped Cilium to
  # 1.20.0 and Flux to v2.9.3 on the same day (2026-07-30); it moves the pinned
  # version in the generator, never the generated artifact. Both committed
  # manifests stayed two weeks behind the versions the repo claimed, and the
  # only check that compares them was a target a human had to remember.
  manifests:
    name: Generated Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Install Helm (pinned + checksum-verified)
        env:
          # renovate: datasource=github-releases depName=helm/helm extractVersion=^v(?<version>.*)$
          HELM_VERSION: "4.2.4"
        run: |
          set -euo pipefail
          asset="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -O "https://get.helm.sh/${asset}"
          curl -fsSL "https://get.helm.sh/${asset}.sha256sum" | sha256sum -c
          tar xzf "${asset}" linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          rm -rf "${asset}" linux-amd64

      - name: Setup Task
        run: ./scripts/internal/install-task.sh

      - name: task render-check
        run: task render-check

  # No job-level `if:` here, deliberately — see the `changes` job's comment.
  # A skipped matrix job never expands, so `Validate (cluster)` and
  # `Validate (talos-image)` would collapse into one check named `Validate`,
  # which cannot satisfy required checks named after the expanded matrix.
  # The job always runs; only the substantive steps are gated, per matrix
  # entry, so both check names always exist — just near-instant when
  # code == 'false'.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    strategy:
      matrix:
        # Validate every OpenTofu root, not just the cluster. talos-image is a
        # separate root (own backend + providers).
        root: [cluster, talos-image]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        if: needs.changes.outputs.code == 'true'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2
        with:
          # renovate: datasource=github-releases depName=opentofu/opentofu extractVersion=^v(?<version>.*)$
          tofu_version: "1.12.6"

      - name: Setup Task
        if: needs.changes.outputs.code == 'true'
        run: ./scripts/internal/install-task.sh

      - name: task validate
        if: needs.changes.outputs.code == 'true'
        run: task validate ROOT=${{ matrix.root }}
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
          TF_VAR_encryption_passphrase: ci-mock-passphrase-for-validation-only-ci

  test:
    name: OpenTofu Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate, changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2
        with:
          # renovate: datasource=github-releases depName=opentofu/opentofu extractVersion=^v(?<version>.*)$
          tofu_version: "1.12.6"

      - name: Setup Task
        run: ./scripts/internal/install-task.sh

      # Rung zero, and it runs first because it is the cheap one: the shell
      # gates against a stub kubectl, seconds rather than the 25-90 minutes a
      # real cloud roll took to surface the same class of defect.
      - name: task test-scripts
        run: task test-scripts

      - name: task test
        run: task test
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
          TF_VAR_encryption_passphrase: ci-mock-passphrase-for-validation-only-ci

  # No job-level `if:` here either, same reason as `validate` above: a
  # skipped matrix job collapses `Emulated Cloud (scaleway)` / `(outscale)`
  # into one literal, unexpanded `Emulated Cloud (${{ matrix.provider }})`
  # check. Steps are gated per matrix entry instead.
  emulated:
    name: Emulated Cloud (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate, changes]
    # The real provider binaries against a real HTTP API, with no account: one
    # step past `tofu test`, which mocks the provider and never leaves the
    # process. See docs/emulated-cloud.md for what it does and does not prove.
    strategy:
      fail-fast: false
      matrix:
        provider: [scaleway, outscale]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        if: needs.changes.outputs.code == 'true'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2
        with:
          # renovate: datasource=github-releases depName=opentofu/opentofu extractVersion=^v(?<version>.*)$
          tofu_version: "1.12.6"

      - name: Setup Task
        if: needs.changes.outputs.code == 'true'
        run: ./scripts/internal/install-task.sh

      - name: Install Feint (pinned + checksum-verified)
        if: needs.changes.outputs.code == 'true'
        run: |
          ./scripts/dev/feint.sh install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: task feint-up
        if: needs.changes.outputs.code == 'true'
        run: task feint-up

      # No credentials anywhere in this job, deliberately: the lane must fail if
      # anything in it ever needs one, rather than quietly reaching a real cloud.
      - name: task feint-plan
        if: needs.changes.outputs.code == 'true'
        run: task feint-plan PROVIDER=${{ matrix.provider }}

      - name: task feint-apply
        if: needs.changes.outputs.code == 'true'
        run: task feint-apply PROVIDER=${{ matrix.provider }}

      - name: task feint-down
        if: always() && needs.changes.outputs.code == 'true'
        run: task feint-down

  # First trial of a machine runtime in this repo's CI (#151): `feint evidence
  # baseline` refuses to pin anything captured under metadata-only machines
  # (every `dataplane` verdict would be a hardcoded `false`), and this is the
  # only way to earn a real one. Kept off the required path with
  # continue-on-error while this is unproven here — not a signal it may be
  # ignored, just that a still-flaky Incus recipe should not block unrelated
  # work the first few times.
  #
  # No job-level `if:` either, same reason as `validate`/`emulated` above: a
  # matrix job skipped by its own `if:` collapses every combination into one
  # unexpanded check name. Steps are gated per matrix entry instead.
  feint-evidence:
    name: Feint Evidence (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [validate, changes]
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        provider: [scaleway, outscale]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        if: needs.changes.outputs.code == 'true'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2
        with:
          # renovate: datasource=github-releases depName=opentofu/opentofu extractVersion=^v(?<version>.*)$
          tofu_version: "1.12.6"

      - name: Setup Task
        if: needs.changes.outputs.code == 'true'
        run: ./scripts/internal/install-task.sh

      - name: Install Feint (pinned + checksum-verified)
        if: needs.changes.outputs.code == 'true'
        run: |
          ./scripts/dev/feint.sh install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The Zabbly stable channel, not the distro package: Ubuntu 24.04 ships
      # Incus 6.0.0, below the 6.0.4 floor where NIC ACLs start being
      # accepted. Mirrors stephrobert/feint's own runtime-proof.yml, the only
      # place this recipe has actually been proven on a GitHub-hosted runner.
      - name: Install Incus (Zabbly stable, key fingerprint pinned)
        if: needs.changes.outputs.code == 'true'
        env:
          ZABBLY_FPR: "4EFC590696CB15B87C73A3AD82CC8797C838DCFD"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          curl --retry 3 --retry-connrefused -fsSL https://pkgs.zabbly.com/key.asc -o "${workdir}/zabbly.asc"
          fpr="$(gpg --show-keys --with-colons "${workdir}/zabbly.asc" | awk -F: '/^fpr/ {print $10; exit}')"
          if [ "${fpr}" != "${ZABBLY_FPR}" ]; then
            echo "unexpected Zabbly key fingerprint: ${fpr}" >&2
            exit 1
          fi
          sudo install -D -m 0644 "${workdir}/zabbly.asc" /etc/apt/keyrings/zabbly.asc
          # shellcheck disable=SC1091
          codename="$(. /etc/os-release && echo "${VERSION_CODENAME}")"
          arch="$(dpkg --print-architecture)"
          sudo tee /etc/apt/sources.list.d/zabbly-incus.sources >/dev/null <<EOF
          Enabled: yes
          Types: deb
          URIs: https://pkgs.zabbly.com/incus/stable
          Suites: ${codename}
          Components: main
          Architectures: ${arch}
          Signed-By: /etc/apt/keyrings/zabbly.asc
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends incus incus-client
          sudo incus admin init --minimal
          sudo incus --version

      # The runner image ships Docker, which sets the host's iptables FORWARD
      # policy to DROP — every packet an Incus machine sends or receives would
      # die on a policy Incus never wrote. Same fix stephrobert/feint's own CI
      # applies for the same reason.
      - name: Keep the runner's Docker firewall out of the verdict
        if: needs.changes.outputs.code == 'true'
        run: sudo iptables -P FORWARD ACCEPT

      - name: task feint-evidence
        if: needs.changes.outputs.code == 'true'
        run: task feint-evidence PROVIDER=${{ matrix.provider }}

      # Has what `.feint-evidence-<provider>.json` pins stopped being true?
      # `continue-on-error` on the job (above) is what keeps this from blocking
      # unrelated PRs on the startup race measured on this job's first runs
      # (#151) — not a signal this check may be ignored.
      - name: task feint-evidence-verify
        if: needs.changes.outputs.code == 'true'
        run: task feint-evidence-verify PROVIDER=${{ matrix.provider }}

      # `evidence baseline` only reads the file `feint evidence` already wrote,
      # so this needs no live emulator — safe to run after `feint-down`. A
      # log line is not a build artifact: exact bytes, not a hand transcription
      # of terminal output, are what a baseline this repo commits is built from.
      - name: Capture the baseline as a build artifact
        if: needs.changes.outputs.code == 'true'
        run: |
          ./scripts/dev/feint.sh evidence-baseline ${{ matrix.provider }} \
            > "/tmp/feint-evidence-${{ matrix.provider }}.json"

      - name: task feint-down
        if: always() && needs.changes.outputs.code == 'true'
        run: task feint-down

      - name: Upload the baseline
        if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: feint-evidence-${{ matrix.provider }}
          path: /tmp/feint-evidence-${{ matrix.provider }}.json
          retention-days: 7

  talos:
    name: Talos Config Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # The repository's own installer, so this job cannot validate configs with
      # a talosctl the clusters do not run. It reads talos-version.sh, the one
      # place that decides `talos_version`. This step used to carry a second pin
      # of its own and it had drifted two patches behind — v1.13.7 against the
      # v1.13.9 both roots pin — with nothing comparing the pair.
      - name: Install talosctl (pinned + checksum-verified)
        run: |
          ./scripts/internal/install-talosctl.sh
          talosctl version --client

      - name: Generate Talos secrets
        run: talosctl gen secrets --output-file /tmp/talos-secrets.yaml

      - name: Generate Talos configs
        run: |
          talosctl gen config \
            --with-secrets /tmp/talos-secrets.yaml \
            --output /tmp/talos-configs \
            --output-types controlplane,worker \
            ci-test-cluster https://127.0.0.1:6443

      - name: Validate control plane config
        run: talosctl validate --config /tmp/talos-configs/controlplane.yaml --mode metal

      - name: Validate worker config
        run: talosctl validate --config /tmp/talos-configs/worker.yaml --mode metal

      - name: Check kube-proxy is disabled
        run: |
          grep -q 'disabled: true' /tmp/talos-configs/controlplane.yaml

  security:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # 0.35.0
        with:
          scan-type: config
          scan-ref: infrastructure/
          severity: HIGH,CRITICAL
          exit-code: 1
          # Exclude the upstream-vendored bootstrap manifests from the IaC gate.
          # cilium*.yaml (helm template cilium) and flux-install.yaml (Flux's
          # official install.yaml) are not our configuration to fix — their
          # privileged/host-network/wildcard-RBAC posture is inherent to a CNI
          # and a GitOps reconciler. They are reviewed when regenerated by
          # scripts/bootstrap/render-bootstrap-manifests.sh. Our own template
          # flux-bootstrap.yaml.tftpl is NOT scanned here (.tftpl matches no
          # Trivy detector) — `task lint`'s check-flux-schema.sh validates it
          # instead, against CRD schemas extracted from the vendored
          # flux-install.yaml (#114).
          skip-files: |
            **/bootstrap-manifests/cilium*.yaml
            **/bootstrap-manifests/flux-install.yaml

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7  # v12
        with:
          directory: infrastructure/opentofu
          # framework is declared in .checkov.yaml; not duplicated here.
          # soft_fail removed: Checkov now gates the pipeline. Add explicit,
          # justified exceptions in .checkov.yaml (skip-check) rather than
          # silencing every finding.
          config_file: .checkov.yaml
