# Cléa — what this repository pins, what upstream published, and whether the gap
# survives being installed.
#
# Nothing here can reach a cloud: no provider credential is passed, and the lane
# must fail rather than acquire one. Renovate still owns proposing the bumps —
# Cléa watches, probes and reports. Two systems opening PRs for the same
# dependency is a collision this repository has already paid for once (see
# .github/dependabot.yml).
#
# ⚠️ GitHub disables a scheduled workflow after 60 days with no repository
# activity. A silent Cléa is what this file exists to notice in others; check
# the report issue's date before trusting it.
name: Clea

on:
  schedule:
    # Daily, tools only. Deliberately not on the hour: a shared runner pool is
    # busiest at :00, and nothing here is time-critical.
    - cron: "17 4 * * *"
    # Weekly, the local Talos cluster on Docker plus the heavy installers.
    - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      lane:
        description: "daily (tools) | weekly (local cluster + heavy installers)"
        type: choice
        options: [daily, weekly]
        default: daily

# One Cléa at a time: two runs would race on the same probe branches.
concurrency:
  group: clea
  cancel-in-progress: false

# Read-only baseline. Every job that needs more declares it itself, scoped to
# what that job actually does — see #124: this used to be contents:write +
# issues:write for the whole workflow, including the jobs that install and run
# code published upstream that same day.
permissions:
  contents: read

env:
  WEEKLY: ${{ github.event.schedule == '41 3 * * 0' || inputs.lane == 'weekly' }}

jobs:
  scan:
    name: Scan upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      state: ${{ steps.scan.outputs.state }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      issue: ${{ steps.issue.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # The report issue is also the state store: `clea report` embeds the state
      # in an HTML comment at the end of its body. No artifact, no cache, and
      # the durable record is the thing a human already reads.
      #
      # Every open, labelled issue is fetched — not just the newest (#127): a
      # human labelling an unrelated issue with this label, to cross-reference
      # a finding, is the natural thing to do, and `per_page=1` on the API's
      # created-desc default picked exactly that issue over the real report
      # the moment it was newer, which then got PATCHed over wholesale. `clea
      # pick-issue` matches on what only this automation itself ever writes —
      # see `pick_report_issue` in scripts/clea/clea.py.
      - name: Previous state, from the report issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LABEL="$(python3 scripts/clea/clea.py config report.label)"
          api="https://api.github.com/repos/${{ github.repository }}"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "$api/issues?labels=${LABEL}&state=open&per_page=100" > issues.json
          number="$(python3 scripts/clea/clea.py pick-issue --issues issues.json --body-out previous.md)"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Authenticated, always. Unauthenticated the API allows 60 requests an
      # hour from an IP shared with every other GitHub customer — which is what
      # took `main` red on 2026-08-13 with nothing wrong in the code.
      - name: clea scan
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/clea/clea.py scan --previous previous.md --state clea-state.json
          {
            echo "state<<CLEA_EOF"
            cat clea-state.json
            echo "CLEA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: What to probe
        id: matrix
        run: |
          set -euo pipefail
          # if/then, not `[ … ] && flag=…`: under `set -e` a false test is a
          # failing command and takes the step with it. That shape has cost this
          # repository a whole lane before.
          if [ "${WEEKLY}" = "true" ]; then flag=--heavy-only; else flag=--daily; fi
          matrix="$(python3 scripts/clea/clea.py matrix --state clea-state.json "$flag")"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "${matrix}" >> "$GITHUB_STEP_SUMMARY"

      # Offline, and it gates: a pin no inventory watches is a pin nobody bumps.
      # It runs here too, not only in `task lint`, because the state of the tree
      # on a schedule is what the report is about.
      - name: clea coverage
        continue-on-error: true
        run: python3 scripts/clea/clea.py coverage | tee -a "$GITHUB_STEP_SUMMARY"

  probe:
    name: Probe ${{ matrix.entry.dep }}
    needs: scan
    if: needs.scan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        entry: ${{ fromJSON(needs.scan.outputs.matrix) }}
    # Through the environment, never interpolated into a shell or a heredoc: a
    # dependency name reaches a `run:` block as data, and ${{ }} would make it
    # code. Trusted today, and the rule costs nothing.
    env:
      DEP: ${{ matrix.entry.dep }}
      VERSION: ${{ matrix.entry.version }}
      SLUG: ${{ matrix.entry.slug }}
      INSTALLER: ${{ matrix.entry.installer }}
      VERSION_CMD: ${{ matrix.entry.version_cmd }}
      INSTALLER_STDIN: ${{ matrix.entry.installer_stdin }}
      # What an action-sha pin needs to move with its comment; empty for any other dependency.
      CLEA_SHA: ${{ matrix.entry.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # persist-credentials: false — the full opt-out, not a partial one.
      # actions/checkout does not write GITHUB_TOKEN as a simple top-level
      # `.git/config` key: it writes an `includeIf.gitdir:…` entry pointing at
      # a separate temp file, and unsetting the key directly (attempted here
      # previously) silently touches nothing, because the value never lived
      # in the file that command writes to. `--unset-all` reported no error
      # and changed nothing; the persisted credential kept winning over the
      # URL-embedded one, identically to never having overridden it at all —
      # confirmed 2026-08-24 on this workflow's fifth real run, same
      # "GitHub App … without `workflows` permission" rejection as the very
      # first attempt. With nothing persisted at all, only the credential this
      # job builds explicitly is ever in play.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # First, and on the untouched tree: probe.sh installs the CURRENT pin so
      # there is something to upgrade over, and restores the tree when it is
      # done. Bumping before this would leave nothing to upgrade from.
      - name: Install from cold, then upgrade over the old version
        id: probe
        if: matrix.entry.installer != ''
        continue-on-error: true
        run: |
          set -o pipefail
          ./scripts/clea/probe.sh "$DEP" "$VERSION" "$INSTALLER" "$VERSION_CMD" \
            "$INSTALLER_STDIN" 2>&1 | tee probe.log

      - name: Apply the bump
        run: |
          set -euo pipefail
          git checkout -- .
          python3 scripts/clea/clea.py bump ${CLEA_SHA:+--sha "$CLEA_SHA"} "$DEP" "$VERSION"

      # The repository's own installer, not a hand-written list of steps: a
      # second list is a second pin to drift, and this is also the only place
      # anything continuously exercises setup.sh.
      - name: The toolchain this repository ships
        run: printf 'y\n' | ./scripts/setup.sh

      # Cilium and Flux are pinned in a generator whose OUTPUT is committed.
      # Bumping the pin without re-rendering leaves the two disagreeing, which
      # is a real failure — so render here and let the branch carry both halves.
      - name: Regenerate what the bump makes stale
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY' > regen.sh
          import tomllib
          with open("clea.toml", "rb") as handle:
              for command in tomllib.load(handle).get("lane", {}).get("regen", []):
                  print(command)
          PY
          bash -x regen.sh

      # For a dependency whose only consumer is a CI job, this is the whole
      # probe: a push carrying GITHUB_TOKEN does not trigger a workflow, so
      # whatever must run on a probe branch runs here or nowhere.
      - name: The repository's own gates, with the bump applied
        id: gates
        continue-on-error: true
        run: |
          set -o pipefail
          python3 - <<'PY' > gates.sh
          import tomllib
          with open("clea.toml", "rb") as handle:
              for command in tomllib.load(handle).get("lane", {}).get("repo", []):
                  print(f'echo "=== {command} ==="')
                  print(command)
          PY
          bash -e gates.sh 2>&1 | tee gates.log

      - name: Verdict, and the commit that carries it
        env:
          GREEN: ${{ steps.probe.outcome != 'failure' && steps.gates.outcome != 'failure' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          # ANSI stripped before this goes anywhere near JSON. This blob is
          # embedded in a GitHub issue body (as an HTML-comment-wrapped JSON
          # state, for the next scan's --previous diff) and round-tripped back
          # out of it — and GitHub's own issue-body storage does not return raw
          # terminal escape sequences unchanged: `\u001b[32m` came back on this
          # workflow's sixth real run as the literal three characters `\^[`,
          # which is not valid JSON and broke the embedded state entirely.
          # Terminal color has no reason to survive into stored data anyway.
          ansi = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
          log = ""
          for name in ("probe.log", "gates.log"):
              path = pathlib.Path(name)
              if path.is_file():
                  log += ansi.sub("", path.read_text(errors="replace"))[-2000:]
          json.dump({
              "dep": os.environ["DEP"],
              "version": os.environ["VERSION"],
              "green": os.environ["GREEN"] == "true",
              "branch": "clea/probe/" + os.environ["SLUG"],
              "run": os.environ["RUN_URL"],
              "log": log,
          }, open("clea-probe.json", "w"), indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -u and one explicit path, never -A: setup.sh leaves install-opentofu.sh
          # in the root when its download fails, and a probe branch is not the
          # place to publish a vendored installer.
          git add -u
          git add clea-probe.json
          git commit -q -m "chore(clea): probe ${DEP} ${VERSION}"
          # Packaged as a patch, not pushed from here (#124): everything above
          # this step ran code published upstream that same day (probe.sh)
          # plus this repository's own regen/gates. A PATH shim dropped by any
          # of that could capture a credential held in THIS job's environment
          # — so this job never holds contents:write, and the `push` job,
          # which runs none of that code, applies the patch instead.
          git format-patch -1 HEAD --stdout > "${SLUG}.patch"

      - name: Hand the branch to the push job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: clea-probe-${{ env.SLUG }}
          path: ${{ env.SLUG }}.patch
          retention-days: 1

  cluster:
    name: Local Talos cluster
    needs: scan
    if: |
      always() && needs.scan.result == 'success' &&
      (github.event.schedule == '41 3 * * 0' || inputs.lane == 'weekly')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # One control plane, one worker. This repository's own default is 3 + 3,
      # which is six Talos containers on a shared runner; the topology below is
      # supported (non-HA, control plane tainted) and this lane asks whether the
      # Talos/Kubernetes pair BOOTS, not whether it is highly available.
      TF_VAR_control_plane_count: "1"
      TF_VAR_worker_count: "1"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # See the probe job's checkout: persist-credentials: false is the full
      # opt-out, needed for the same reason — nothing here relies on ambient
      # git auth except the final push, which builds its own credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # Also the cold-install probe for helm and flux, which have no installer
      # of their own — they are steps inside this script.
      - name: The toolchain this repository ships
        run: printf 'y\n' | ./scripts/setup.sh

      - name: Bump Talos and Kubernetes to what upstream publishes
        continue-on-error: true
        env:
          STATE: ${{ needs.scan.outputs.state }}
        run: |
          set -euo pipefail
          printf '%s' "$STATE" > clea-state.json
          python3 - <<'PY' > bumps.sh
          import json
          state = json.load(open("clea-state.json"))
          wanted = ("siderolabs/talos", "kubernetes/kubernetes")
          for dep in state["deps"]:
              if dep["dep"] in wanted and dep.get("behind") and dep.get("pinned"):
                  print(f'python3 scripts/clea/clea.py bump {dep["dep"]} {dep["latest"]}')
          PY
          bash -x bumps.sh
          git --no-pager diff --stat

      - name: task local-up
        id: up
        run: |
          ./scripts/bootstrap/render-bootstrap-manifests.sh --local
          task local-up

      - name: task local-verify
        id: verify
        run: task local-verify

      - name: task local-down
        if: always()
        run: task local-down || true

      - name: Verdict
        if: always()
        env:
          UP: ${{ steps.up.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, re, pathlib
          text = pathlib.Path("infrastructure/opentofu-local/variables.tf").read_text()

          def pin(name):
              m = re.search(r'variable "%s"[\s\S]*?default\s*=\s*"([^"]+)"' % name, text)
              return m.group(1) if m else "?"

          green = os.environ["UP"] == "success" and os.environ["VERIFY"] == "success"
          json.dump({
              "dep": "local-cluster",
              "version": pin("talos_version"),
              "green": green,
              "branch": "clea/probe/local-cluster",
              "run": os.environ["RUN_URL"],
              "cluster_lane": {
                  "verdict": "deployed and verified" if green else
                             f'up={os.environ["UP"]}, verify={os.environ["VERIFY"]}',
                  "at": datetime.datetime.now(datetime.timezone.utc)
                        .isoformat(timespec="seconds"),
                  "talos": pin("talos_version"),
                  "k8s": pin("kubernetes_version"),
              },
          }, open("clea-probe.json", "w"), indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add clea-probe.json
          git commit -q -m "chore(clea): local cluster lane"
          # See the probe job's verdict step (#124): packaged as a patch, not
          # pushed — this job also ran freshly installed upstream code (helm,
          # flux, talosctl, via setup.sh) before this point.
          git format-patch -1 HEAD --stdout > local-cluster.patch

      - name: Hand the branch to the push job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: clea-probe-local-cluster
          path: local-cluster.patch
          retention-days: 1

  push:
    name: Push probe branches
    needs: [scan, probe, cluster]
    if: always() && needs.scan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job in this workflow holding contents:write. Deliberately: it
    # is also the only job that runs none of the code published upstream that
    # `probe`/`cluster` just installed and ran — nothing here but this
    # repository's own checkout action and git. #124.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Collect the probe/cluster branches
        id: download
        continue-on-error: true  # nothing to probe today is not a failure
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: clea-probe-*
          path: patches
          merge-multiple: true

      # Pushed green or red on purpose: a red branch is the reproduction, and
      # deleting it leaves a report describing something nobody can re-run.
      - name: Apply each patch and push its branch
        if: steps.download.outcome == 'success'
        env:
          # Optional. GITHUB_TOKEN cannot push a change to a file under
          # .github/workflows/ (no `permissions:` grant exists for it); only a
          # classic PAT with the `workflow` scope can. The script falls back to
          # the default token when this is unset OR rejected, which still pushes
          # every other probe branch.
          CLEA_WORKFLOW_TOKEN: ${{ secrets.CLEA_WORKFLOW_TOKEN }}
          # The checkout above does not persist a credential: the script builds
          # its own, this one included.
          DEFAULT_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: ./scripts/clea/push-probes.sh "${{ github.sha }}" patches

  report:
    name: Report
    needs: [scan, probe, cluster, push]
    if: always() && needs.scan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # prune stale clea/probe/* branches, below
      issues: write     # rewrite the report issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect the probe verdicts from their own branches
        env:
          STATE: ${{ needs.scan.outputs.state }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_RESULT: ${{ needs.push.result }}
        run: |
          set -euo pipefail
          printf '%s' "$STATE" > clea-state.json
          git fetch -q origin "+refs/heads/clea/probe/*:refs/remotes/origin/clea/probe/*" || true
          python3 - <<'PY'
          import json, os, subprocess, sys, urllib.request
          sys.path.insert(0, "scripts/clea")
          import clea
          state = json.load(open("clea-state.json"))
          refs = subprocess.run(["git", "for-each-ref", "--format=%(refname:short)",
                                 "refs/remotes/origin/clea/probe/*"],
                                capture_output=True, text=True).stdout.split()
          probes, cluster = [], None
          for ref in refs:
              blob = subprocess.run(["git", "show", f"{ref}:clea-probe.json"],
                                    capture_output=True, text=True)
              if blob.returncode:
                  continue
              try:
                  probe = json.loads(blob.stdout)
              except ValueError:
                  continue
              if probe.get("cluster_lane"):
                  cluster = probe["cluster_lane"]
              else:
                  probes.append(probe)
          state["probes"] = probes
          if cluster:
              state["cluster_lane"] = cluster

          # A probe job can fail before it ever reaches its own verdict-push
          # step — most durably, GITHUB_TOKEN cannot push a change to a file
          # under .github/workflows/, and no `permissions:` grant can fix
          # that (there is no such scope; only a PAT with the classic
          # `workflow` scope can, and that is a credential decision, not a
          # workflow-file one). Cross-referenced against the run's own job
          # list — data the platform already has, not a second push path —
          # so a dependency that failed to record a verdict is at least named
          # rather than silently missing from the report.
          got = {p["dep"] for p in probes}
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/jobs?per_page=100",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json"})
          jobs = json.load(urllib.request.urlopen(req, timeout=30))["jobs"]
          stalled = [
              {"dep": j["name"].removeprefix("Probe "),
               "job": j["name"], "url": j["html_url"]}
              for j in jobs
              if j["name"].startswith("Probe ") and j["conclusion"] == "failure"
              and j["name"].removeprefix("Probe ") not in got]
          state["stalled_probes"] = stalled
          # A probe that PASSED but whose verdict reached no branch (the push
          # job failed): the report would otherwise read "not probed".
          state["push_result"] = os.environ.get("PUSH_RESULT", "")
          state["lost_verdicts"] = clea.lost_verdicts(state, jobs)

          json.dump(state, open("clea-state.json", "w"), indent=2)
          print(f"{len(probes)} probe verdict(s), {len(stalled)} stalled, "
                f"cluster lane: {bool(cluster)}")
          PY

      - name: Rewrite the report issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ needs.scan.outputs.issue }}
        run: |
          set -euo pipefail
          python3 scripts/clea/clea.py report --state clea-state.json --out report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          api="https://api.github.com/repos/${{ github.repository }}"
          # The label may not exist yet; 422 means it already does.
          label="$(python3 scripts/clea/clea.py config report.label)"
          curl -sS -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" \
               "$api/labels" \
               -d "{\"name\":\"${label}\",\"color\":\"0e8a16\",\"description\":\"Clea dependency report\"}" || true
          python3 - <<'PY' > payload.json
          import json, sys, tomllib
          with open("clea.toml", "rb") as handle:
              report = tomllib.load(handle).get("report", {})
          json.dump({"title": report.get("title", "Clea"),
                     "body": open("report.md").read(),
                     "labels": [report.get("label", "clea")]}, sys.stdout)
          PY
          if [ -n "${NUMBER}" ]; then
            curl -sS -o /dev/null -X PATCH -H "Authorization: Bearer $GH_TOKEN" \
                 "$api/issues/${NUMBER}" --data @payload.json
            echo "report issue #${NUMBER} rewritten"
          else
            curl -sS -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" \
                 "$api/issues" --data @payload.json
            echo "report issue created"
          fi

      - name: Probe branches whose bump already landed
        env:
          # The checkout above does not persist a credential (#124) — this
          # push builds its own explicitly, same as the push job's.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/clea/clea.py prune > stale.txt || true
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          while read -r branch; do
            [ -n "$branch" ] || continue
            echo "pruning ${branch}"
            git push -q "$remote" --delete "$branch" || true
          done < stale.txt
