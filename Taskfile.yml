version: "3"

# One knob for "which local ports the Talos tunnels use". The scripts read
# TALOS_TUNNEL_OFFSET; the cluster root needs the same number to know where to
# connect, and gets it from here rather than from a second variable a caller
# could forget to keep in step. Default 0 = the historical fixed block.
env:
  TF_VAR_talos_tunnel_port_offset:
    sh: echo "${TALOS_TUNNEL_OFFSET:-0}"

# The repo's real OpenTofu roots. ⚠️ DO NOT go back to a
# `-recursive infrastructure/opentofu`: it would sweep in untracked local
# scratch directories (e.g. `_v2/`), which used to fail `task lint`.
# Add every new root here.
vars:
  TF_ROOTS: >-
    infrastructure/opentofu/cluster
    infrastructure/opentofu/modules
    infrastructure/opentofu/talos-image
    infrastructure/opentofu-local
    infrastructure/opentofu-feint

tasks:
  default:
    # `task --list` prints 52 targets in alphabetical order, which is a map of the
    # repository rather than a path through it. Most of them are steps of `up`, dev
    # rungs, or belong to a later version. This is the path.
    silent: true
    cmds:
      - |
        cat <<'EOT'
        OpenAether — one Talos cluster, on any provider.

        Deploy and operate, in order:
          task setup                              install the toolchain
          task bucket-suffix                      a discriminator for your bucket names
          task infra-plan      PROVIDER=…         what would be created, before spending
          task cluster-up      PROVIDER=… KEY=…   the journey: image → infra → bootstrap
          task cluster-verify  PROVIDER=…         ask the cluster whether it is what we promise
          task cluster-upgrade PROVIDER=… KEY=…   Kubernetes then Talos, measuring the outage

        Destroying takes TWO commands, on purpose — no single line can do it:
          task cluster-down PROVIDER=… -- --plan                  computes, destroys nothing
          task cluster-down PROVIDER=… -- --plan-file F --yes     lands exactly that plan

        Nothing asks you a question except `cluster-up`, once, before it spends. Add APPROVE=auto
        to answer it in advance — for CI, and for a shell that cannot be asked.
        APPROVE=auto is deliberately powerless on anything that destroys.

        When you need them:
          task kubeconfig        PROVIDER=…   get access back
          task state             PROVIDER=…   what the cluster's state holds (ADDR=… for one resource)
          task restore-artifacts PROVIDER=…   recover access from the encrypted backups
          task tunnels-up        PROVIDER=…   open the Talos API tunnels

        Before you push:
          task preflight                  everything provable without a cloud account

        Everything else — the steps `up` runs for you, the local and emulated rungs,
        the CAPI and application targets — is still there:  task --list-all

        Start here: docs/first-cluster.md
        EOT

  setup:
    desc: Install dependencies (OpenTofu, Talosctl, Kubectl, Task, pre-commit)
    cmds:
      - ./scripts/setup.sh

  bucket-suffix:
    desc: >-
      Print a fresh bucket_suffix to paste into your tfvars. S3 bucket names are unique across a
      whole provider, not per account — without one you inherit whatever names someone else took.
    silent: true
    cmds:
      - |
        printf 'bucket_suffix = "%s"\n' "$(openssl rand -hex 3)"
        echo "# Paste into infrastructure/opentofu/cluster/envs/<role>-<provider>.tfvars."
        echo "# Pick it ONCE: changing it later orphans every bucket you already have."

  preflight:
    desc: >-
      Everything provable WITHOUT a cloud account, in one command. Run it before spending: a defect
      found here costs minutes, the same defect found on a paid cluster costs the run and its teardown.
    # DELIBERATELY SHORT — about four minutes. The first draft of this gate was
    # fifteen and could not finish on the author's own machine, and a gate that
    # is skipped protects nothing. `security` (needs checkov), `feint-test` and
    # `local-up` (need Docker) are heavier and belong to CI or to a deliberate
    # full run, not to the thing typed before every attempt.
    cmds:
      - task: lint
      - task: render-check
      - task: validate
        vars: {ROOT: cluster}
      - task: validate
        vars: {ROOT: talos-image}
      - task: test
      - task: test-scripts
      - cmd: |
          echo
          if [ "${RENDER_CHECK_ALLOW_OFFLINE:-0}" = 1 ]; then
            echo "⚠ preflight INCOMPLETE — RENDER_CHECK_ALLOW_OFFLINE=1 was set, so the vendored"
            echo "  flux-install.yaml was never compared against upstream. Everything else passed."
          else
          echo "✓ preflight green — every free rung passed."
          echo "  NOT covered here — only a cloud run can show that the provider accepts these"
          echo "  arguments, that the stored state is ciphertext, that an upgrade keeps the API"
          echo "  up, and that the teardown leaves the account empty. All four HAVE been shown on"
          echo "  real clouds: see the table in docs/status.md for which, when, and how long."
          fi

  lint:
    desc: Lint and format code (OpenTofu, YAML)
    cmds:
      - tofu fmt -check -recursive {{.TF_ROOTS}}
      - yamllint -c infrastructure/.yamllint infrastructure/
      # Same config, the repo's other YAML — CI used to only lint
      # infrastructure/, so a broken .github/workflows/*.yml would pass CI
      # and only get caught by a contributor's local pre-commit, if they had
      # it installed. `task lint` now matches what pre-commit checks.
      - yamllint -c infrastructure/.yamllint .github/ .pre-commit-config.yaml Taskfile.yml .checkov.yaml
      # NOT `tflint --recursive` on its own: it resolves .tflint.hcl per
      # directory, so thirteen of fourteen were linted with no config and passed.
      # The script names the config and proves it loaded before trusting the run.
      - ./scripts/dev/tflint-all.sh
      # yamllint says a workflow is well-formed YAML; it cannot say that a
      # `${{ needs.x.outputs.y }}` names an output that exists, and a scheduled
      # workflow cannot be dry-run — its first execution is production. This
      # also runs shellcheck over every `run:` block.
      - actionlint
      # The detector CLAUDE.md asks for and the repository did not have.
      # English is canonical; French belongs in *.fr.md, and .languageignore
      # lists what is French on purpose, one reason per entry.
      - ./scripts/dev/check-language.sh
      # shellcheck was installed by setup.sh and invoked by nothing — 48 tracked
      # scripts, none of them gated. -S error only: the 23 warnings below that
      # level are style, and a lint that fails on style gets bypassed.
      - shellcheck -S error $(git ls-files '*.sh')
      # One tool, one version, everywhere it is claimed. Four instances of that
      # defect landed in one week and every one was mechanically checkable.
      - ./scripts/dev/check-version-drift.sh
      # And one version, watched by something. check-version-drift.sh compares
      # the pins to each other; this compares them to the inventory that is
      # supposed to bump them. Nine anchors were inert when it was written —
      # a pin nothing watches is a pin nobody bumps, and it looks identical to
      # a healthy one. Offline, milliseconds.
      - python3 scripts/clea/clea.py coverage
      # provider-contract.md is the document CLAUDE.md and the provider-module
      # skill call the authority, and nothing read it: it required a variable no
      # module has ever declared. The tables are checked now, not just written.
      - ./scripts/dev/check-provider-contract.sh
      # Required inputs must be named where the operator will look. A variable
      # with no default that no document mentions is a deploy that works for us
      # and fails for a stranger — the release criterion is that the docs are
      # followable, not that we know the answers.
      - ./scripts/dev/check-doc-inputs.sh
      # A script nobody invokes is the failure mode task test-scripts exists
      # for, one level up: the check does the work, it is simply never asked.
      - ./scripts/dev/check-script-reachability.sh
      # A path stops resolving and nothing notices — in a comment, read once,
      # or a printed string, read (and copy-pasted) on every run (#118).
      - ./scripts/dev/check-dead-references.sh
      # ci.yml installed yamllint/shellcheck/renovate-config-validator with no
      # version pin, between a comment arguing against exactly that (#113).
      - ./scripts/dev/check-tool-pins.sh
      # flux-bootstrap.yaml.tftpl was read by nothing — not Trivy (no
      # detector for .tftpl, despite a comment claiming otherwise), not
      # yamllint (scoped to *.yaml/*.yml) (#114).
      - ./scripts/dev/check-flux-schema.sh
      # cilium.yaml/flux-install.yaml pin their images by digest/tag; a tag
      # force-moved upstream changes no committed byte, so this compares
      # against the sha256 recorded the last time either was rendered (#119).
      - ./scripts/dev/check-upstream-artifacts-lock.sh

  fmt:
    desc: Format OpenTofu code
    cmds:
      - tofu fmt -recursive {{.TF_ROOTS}}

  validate:
    desc: "Validate an OpenTofu root. Usage: task validate [ROOT=cluster|talos-image]"
    vars:
      ROOT: '{{.ROOT | default "cluster"}}'
    dir: "infrastructure/opentofu/{{.ROOT}}"
    # ⚠️ TF_DATA_DIR is what makes this check runnable WITHOUT cloud credentials.
    # `-backend=false` alone is not enough: as soon as a root has been through a
    # `task infra` / `task destroy`, its `.terraform/terraform.tfstate` records
    # the configured S3 backend, and OpenTofu tries to reach it even when the
    # backend is disabled — failing with a message that names neither the cache
    # nor the cause:
    #   No valid credential sources found
    #   failed to refresh cached credentials, no EC2 IMDS role found
    # Since that cache is the normal state of a working tree, a check meant to
    # run offline never ran (observed 2026-07-28). A dedicated data dir isolates
    # it from the backend cache while still caching the providers between runs.
    # Shared with `test`, which needs the same isolation for the same reason.
    env:
      TF_DATA_DIR: .terraform-validate
    cmds:
      # -upgrade because .terraform.lock.hcl is gitignored — a pure local cache,
      # yet shared with the deploy lane. Without it, every existing clone breaks
      # the moment a version constraint moves, naming a command this never runs.
      - tofu init -backend=false -upgrade
      - tofu validate

  apps-validate:
    desc: "Validate the OpenAether-apps Flux DAG, the generated pick.py profiles and the children's Cilium"
    cmds:
      # Cilium parity foundation ↔ CAPI children: two formats (the render
      # script's --set vs a HelmRelease's values:) in two repos, hence silent
      # drift. It cost two children on 2026-07-26 (ipam.mode lost).
      - python3 scripts/ops/check-cilium-parity.py
      # Same reasoning one level up: the skills are duplicated across the two
      # repositories, so something has to notice when they stop matching.
      - ./scripts/dev/check-skill-parity.sh
      - task: apps-validate-dag

  apps-validate-dag:
    internal: true
    dir: ../OpenAether-apps
    cmds:
      # --validate : unknown dependsOn, cycles, dead spec.path, catalogue.
      # --check    : a profile freezes the list of EXCLUDED Kustomizations, so
      #   adding a brick to the DAG makes every generated profile stale. Without
      #   this check the brick is inherited from ../base without being picked and
      #   stays stuck if its dependencies are excluded (real case: orc inherited
      #   by the edge clusters while cluster-api-providers was excluded).
      - python3 scripts/pick.py --validate
      - python3 scripts/pick.py --check

  preflight-quotas:
    desc: >-
      Read-only quota check on a provider BEFORE deploying. Usage: task preflight-quotas
      PROVIDER=ovh|outscale [-- --add-vms 2 --add-cores 4 --add-ram-gb 16]
    vars:
      PROVIDER: '{{.PROVIDER | default "outscale"}}'
    cmds:
      # An HA Outscale management needs 44 GB against a 40 GB memory_limit: the
      # overrun is TOLERATED at creation, then any further VM is refused, with
      # no error in the CAPI CR. Two deployments were lost to it.
      - python3 scripts/ops/preflight-quotas.py {{.PROVIDER}} {{.CLI_ARGS}}

  pipeline-audit:
    desc: >-
      Run the CI policy scanner (plumber) locally — same gate as
      "Pipeline audit" in security.yml, before pushing.
    cmds:
      - |
        command -v plumber >/dev/null 2>&1 || {
          echo "✗ plumber not installed — run ./scripts/setup.sh, or: ./scripts/internal/install-plumber.sh" >&2
          exit 1
        }
        # GH_TOKEN is optional here: without one, branch-protection controls
        # cannot be evaluated and the run reports degraded/incomplete rather
        # than refusing outright — same shape CI's own token-scope fallback
        # already documents (security.yml, "branchMustBeProtected").
        plumber analyze --output plumber-report.json

  security:
    desc: "Run security scans (Trivy, Checkov, Gitleaks, pipeline audit)"
    cmds:
      # Skip the upstream-vendored Cilium/Flux bootstrap manifests (not our
      # config to fix; reviewed at render time). Matches the CI Trivy step.
      - >-
        trivy config infrastructure/ --skip-files "**/bootstrap-manifests/cilium*.yaml"
        --skip-files "**/bootstrap-manifests/flux-install.yaml"
      # Same scope as CI (whole opentofu tree, not just cluster).
      # Fail with the remedy, not with exit 127. checkov only ever existed in CI
      # (a pinned action), so this step died as "executable file not found" on
      # any machine prepared by scripts/setup.sh — which now installs it.
      - |
        command -v checkov >/dev/null 2>&1 || {
          echo "✗ checkov not installed — run ./scripts/setup.sh, or: pipx install checkov" >&2
          exit 1
        }
        checkov -d infrastructure/opentofu --config-file .checkov.yaml
      # The contract's own rules (#123), as checks (CKV_OA_1, CKV_OA_2) — proof
      # each one actually fires: mutates real tracked files under a trap that
      # always restores them, never left in the working tree either way.
      - ./scripts/dev/test-checkov-custom-checks.sh
      # Only what git can see. Scanning the raw tree flagged .env.sh and the
      # *.kubeconfig files — gitignored on purpose — so this gate could never be
      # green on an operator's machine, only on a bare CI runner.
      # `gitleaks dir` takes ONE path: hand it a file list and it silently
      # scans the whole tree instead, which is how that went unnoticed.
      - |
        tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
        git ls-files --cached --others --exclude-standard -z \
          | tar --null -T - -cf - | tar -xf - -C "$tmp"
        cd "$tmp" && gitleaks dir . --redact --no-banner
      # Default rules only, above — the env-data rules in .gitleaks-envdata.toml
      # are scoped to what a PR adds (the `leaks` CI job), because this tree's
      # test fixtures use synthetic-but-routable quads. This asserts they still
      # match; two of them once matched nothing and passed.
      - ./scripts/dev/check-gitleaks-rules.sh
      # Last: without GH_TOKEN this legitimately exits 3 ("incomplete data" —
      # branch protection cannot be evaluated), so it must not swallow the
      # checks above it that CAN succeed offline. Set GH_TOKEN for a complete
      # run; see task pipeline-audit's own description.
      - task: pipeline-audit

  purge-orphans:
    desc: >-
      Last resort: delete resources a teardown left behind, by talking to the provider API
      directly. Usage: task purge-orphans PROVIDER=scaleway|ovh|outscale [APPLY=1].
      Dry-run by default. See scripts/ops/purge-orphans/README.md for the scope warning —
      it targets the WHOLE project, not one cluster.
    # The scripts are the last sentence between a failed teardown and a bill, and
    # they were reachable from prose only: docs/release-checklist.md already told
    # the reader to run `task purge-orphans`, which did not exist.
    vars:
      APPLY: '{{.APPLY | default ""}}'
    preconditions:
      - sh: 'test -f scripts/ops/purge-orphans/{{.PROVIDER}}.py'
        msg: "PROVIDER must be one of scaleway, ovh, outscale (got: '{{.PROVIDER}}')"
    cmds:
      - python3 scripts/ops/purge-orphans/{{.PROVIDER}}.py {{if .APPLY}}--apply{{end}}

  check-jsonpath:
    desc: >-
      Parse every jsonpath the scripts use, with kubectl itself, offline. A
      malformed expression always fails at runtime, so whatever reads it always
      sees nothing — and nothing reads as fine. Cost three cloud rolls to find once.
    cmds:
      - ./scripts/dev/check-jsonpath.sh

  test-gates-local:
    desc: >-
      Rung ONE: the roll's gates against a real Kubernetes in Docker (needs
      `task local-up`). A stub proves the branching; only a real apiserver proves
      the queries run. Does NOT cover `talosctl upgrade` — no disk in a container.
    cmds:
      - ./scripts/dev/test-gates-local.sh

  test-cnpg-gates-local:
    desc: >-
      Rung ONE for the DATABASE gates: rolling-replace.sh's cnpg_* logic against a
      real CloudNativePG in Docker (needs `task local-up`). test-gates-local.sh only
      ever proved CNPG ABSENT; this drives the branch a stub gave eleven green
      assertions to while kubectl could not parse its jsonpath. Installs
      local-path-provisioner and the CNPG operator (pinned) if absent, ~80s.
    cmds:
      - ./scripts/dev/test-cnpg-gates-local.sh

  test-scripts:
    desc: >-
      Unit-test the shell gates against a stub kubectl. Rung ZERO: the defects
      that cost real cloud runs on 2026-08-15 were logic, not cloud — a resource
      name resolving to the wrong CRD, an error read as an empty list, an rc
      capture `set -e` never reached. Seconds here instead of 25-90 minutes there.
    cmds:
      # jsonpath first: a query kubectl cannot parse makes every assertion below
      # it meaningless, and this costs milliseconds.
      - ./scripts/dev/check-jsonpath.sh
      - ./scripts/dev/test-rolling-replace.sh
      # These two were written, they pass, and nothing ever ran them — not this
      # target, not CI. A harness nobody invokes is the failure mode this whole
      # target exists for, one level up: the check does work, it is simply never
      # asked. test-teardown owns the branches that decide whether a management
      # is destroyed while its children keep billing; test-cluster-checks owns
      # the queries that turn "the apply returned" into "the cluster works".
      # Both use a stub kubectl, need no credentials, and cost ~10s together.
      - ./scripts/dev/test-teardown.sh
      - ./scripts/dev/test-cluster-checks.sh
      # The purge scripts are the last sentence between a failed teardown and a
      # bill, and both said "clean" when every API call was refused. Forced-403,
      # in-process, no network.
      - ./scripts/dev/test-purge-orphans.sh
      # Six places build a bucket name, in two languages that cannot import each
      # other. Nothing but this compares them.
      - ./scripts/dev/test-bucket-names.sh
      # The backup path had no inverse until 0.5.0. This is the round trip —
      # the real enc() against the real dec(), offline.
      - ./scripts/dev/test-restore.sh
      # `nc -z` calls a dead ssh -L tunnel healthy. Two local listeners measure
      # the difference the whole tunnel guard rests on.
      - ./scripts/dev/test-endpoint-probe.sh
      # Forgetting the second provider's keys does not fail — it signs the copy
      # with the first provider's. Only the ENDPOINTS can say a backup was meant
      # to be elsewhere, which is what these assert.
      - ./scripts/dev/test-backup-creds.sh
      # `task state` promises it never writes a state. Real task + real tofu on
      # a local-backend fixture; the state's bytes are compared before and after.
      - ./scripts/dev/test-state-task.sh
      # The three scripts between a cluster and a lost tfstate or etcd, and the
      # Day-1 seeder whose one rule is never to rotate what exists. Writing
      # these found a retention slice that deleted 28 of 29 snapshots and two
      # scripts that died silently on an absent optional key.
      - ./scripts/dev/test-state-backups.sh
      - ./scripts/dev/test-seed-openbao.sh
      # Nothing said "tainted", so re-running destroyed a load balancer the
      # provider was still building. This keeps that sentence on screen.
      - ./scripts/dev/test-explain-failure.sh
      # `cluster-up … APPROVE=auto` did not pass APPROVE to phase 2, so an "unattended"
      # journey stopped for an approval after spending. Nothing read the call
      # graph; this does.
      - ./scripts/dev/test-unattended.sh
      - ./scripts/dev/test-talos-image.sh
      # Cléa reads every version this repository claims and rewrites it on a
      # probe branch. Its reader, its writer and its comparator are all places a
      # silent wrong answer would produce a confident report.
      - ./scripts/dev/test-clea.sh
      # setup.sh asked whether a tool was present, never which version it was —
      # so it installed the pin once and refused every upgrade after that. Found
      # by the Cléa probe, guarded here so it does not need Docker to stay fixed.
      - ./scripts/dev/test-setup-checks.sh
      # The SessionStart hook runs under `set -e` and is the only thing that
      # installs the toolchain in a web session. Its Docker block fails in ways
      # the ENVIRONMENT chooses, and any of them returning non-zero leaves the
      # session with no tools at all — a failure nothing would connect to Docker.
      - ./scripts/dev/test-session-start.sh
      # converge-versions.sh had no downgrade guard of its own — it only
      # survived one by accident, on two layers upstream it does not own.
      - ./scripts/dev/test-converge-versions.sh
      # Against an isolated throwaway git repo, not this one — proves
      # check-script-reachability.sh actually flags an unreferenced script
      # and clears once it's wired in, not just that today's tree is clean.
      - ./scripts/dev/test-script-reachability.sh
      # Same isolation, for check-dead-references.sh (#118): proves fences,
      # backtick spans, comments and printed strings are checked, plain prose
      # and fixture-writing redirects are not, and .deadreferencesignore
      # scopes to the one file:candidate pair it names.
      - ./scripts/dev/test-dead-references.sh
      # A host missing CAP_SYS_RESOURCE looked healthy for 90s before this,
      # then died on an unrelated-looking timeout (#54). Against a stubbed
      # capsh, and also against this host's real one where reachable.
      - ./scripts/dev/test-docker-talos-capability.sh
      # A --set typo reaches the cluster silently past every other gate;
      # this proves the effective-config reader (and check-cilium-parity.py's
      # missing-key guard) actually catch it, offline.
      - ./scripts/dev/test-cilium-effective-config.sh
      # `set -e` does not see a process substitution's own git-log failure
      # (#132) — proves a malformed rev-range fails loud instead of reading
      # as zero commits, none of them tool-authored.
      - ./scripts/dev/test-commit-authors.sh
      # feint.sh checked `running` once, immediately after `feint start`
      # returned, with no retry — raced on a GitHub-hosted runner and failed
      # CI once with no code change (#169). A stub feint puts the startup
      # delay under our control; FEINT_RESTART_TIMEOUT=0 reproduces the exact
      # pre-fix behavior through the real code path.
      - ./scripts/dev/test-feint-restart.sh
      # Offline self-test of check-required-checks.sh's diff logic (#122):
      # against canned fixtures, proves it flags a required check that a
      # ruleset never declares (CodeQL-shaped) AND refuses an empty rulesets
      # response instead of reading it as "nothing is required". Live mode
      # needs GITHUB_TOKEN and a real ruleset on main — deliberately not
      # exercised here or wired into any workflow, see the script's header.
      - ./scripts/dev/check-required-checks.sh --self-test

  test:
    desc: Run OpenTofu tests (cluster root)
    dir: infrastructure/opentofu/cluster
    # Same isolation as `validate`, and for the same reason — the comment there
    # claimed this task already matched it, but only the init flag was copied,
    # not TF_DATA_DIR. So every tree that had once deployed failed here on the
    # S3 backend recorded in .terraform/, green on a fresh CI runner only.
    env:
      TF_DATA_DIR: .terraform-validate
      # The mocked lane must not need a credential file. These lived in the CI
      # job only, so locally `tofu test` failed on a required root variable
      # unless you had sourced .env.sh — which is exactly what this rung is
      # supposed to prove you don't need. Values are inert placeholders.
      TF_VAR_encryption_passphrase: test-mock-passphrase-for-validation-only
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
    cmds:
      # Self-sufficient from a cold shell/CI runner — `tofu test` needs the
      # providers and modules resolved first. -upgrade: see `validate`.
      - tofu init -backend=false -upgrade
      - tofu test

  clea-scan:
    desc: >-
      Ask upstream what it has published, offline-safe except for the calls it
      makes: writes clea-state.json and prints the report. Needs GITHUB_TOKEN —
      unauthenticated the API allows 60 requests an hour from a shared IP.
      Usage: task clea-scan
    cmds:
      - python3 scripts/clea/clea.py scan --state clea-state.json
      - python3 scripts/clea/clea.py report --state clea-state.json

  cluster-security:
    desc: "Run runtime security validation tests on the cluster"
    cmds:
      - ./scripts/ops/cluster-security-tests.sh

  # ===========================================================================
  # Talos image (decoupled — build once per Talos version, reused by clusters)
  # ===========================================================================

  image-build:
    aliases: [talos-image]
    desc: >-
      Build + publish the Talos image for a provider. Usage: task talos-image
      PROVIDER=scaleway|ovh|outscale|proxmox [VERSION=v1.13.4] [ENSURE=1]
    # PROVIDER is REQUIRED, not defaulted. Twenty targets used to fall back to
    # scaleway in silence — including destroy and down — so a command typed
    # while working on another cloud aimed at the wrong account. The refusal is
    # the documentation: it names the variable instead of guessing.
    requires:
      vars: [PROVIDER]
    preconditions: &refuse-local
      - sh: '[ "{{.PROVIDER}}" != local ]'
        msg: |
          PROVIDER=local is not for this family. The Docker cluster is not a
          provider — it is a different set of operations, and they carry their
          own names: local-up, local-status, local-verify, local-test,
          local-down. There is no local-upgrade, and that is not an omission:
          a container has no disk for `talosctl upgrade` to write to.
    vars:
      # ROLE was never defaulted here, so the lookup below asked for
      # `-scaleway.tfvars`, a file that cannot exist, and silently fell back to
      # cluster/variables.tf — this task never read a cluster's own pin.
      ROLE: '{{.ROLE | default "management"}}'
      # A task-level `vars:` entry SHADOWS the value passed on the command line,
      # so `task talos-image VERSION=v1.13.7` built v1.13.8 and said nothing.
      # Resolve the fallback under its own name and let VERSION win explicitly.
      # Not an anchor site: talos-version.sh reads the pin from the env's tfvars
      # or cluster/variables.tf, which is where the only anchor belongs.
      PINNED_VERSION:
        sh: ./scripts/internal/talos-version.sh {{.ROLE}}-{{.PROVIDER}}.tfvars
      IMAGE_VERSION: '{{.VERSION | default .PINNED_VERSION}}'
      ENSURE: '{{.ENSURE | default ""}}'
    cmds:
      - './scripts/bootstrap/talos-image.sh {{.PROVIDER}} {{.IMAGE_VERSION}}{{if .ENSURE}} --ensure{{end}}'

  cluster-up:
    aliases: [up]
    desc: >-
      Idempotent one-shot bring-up: image -> render manifests -> infra -> tunnels -> bootstrap -> converge the
      fleet onto the versions the tfvars pins (editing that file IS the decision to upgrade). Usage: task cluster-up
      ROLE=management|workload PROVIDER=… [KEY=~/.ssh/yourkey] [VERSION=v1.13.4] [FORCE=1] [APPROVE=auto].
      It shows the plan and asks once before it spends; APPROVE=auto answers for you, for CI and for a
      shell that cannot be asked.
    # PROVIDER is REQUIRED, not defaulted. Twenty targets used to fall back to
    # scaleway in silence — including destroy and down — so a command typed
    # while working on another cloud aimed at the wrong account. The refusal is
    # the documentation: it names the variable instead of guessing.
    requires:
      vars: [PROVIDER]
    preconditions: *refuse-local
    vars:
      ROLE: '{{.ROLE | default "management"}}'
      KEY: '{{.KEY | default "~/.ssh/id_ed25519"}}'
      # ask | auto — the value names WHO answers the approval, never whether
      # there is one: every apply still plans, then applies that saved plan.
      APPROVE: '{{.APPROVE | default "ask"}}'
      # Not an anchor site: see talos-image above.
      VERSION:
        sh: ./scripts/internal/talos-version.sh {{.ROLE}}-{{.PROVIDER}}.tfvars
    cmds:
      # Everything a later phase needs, checked BEFORE anything bills. The SSH
      # key was verified in bootstrap-phase2, which runs after `infra` — so a
      # missing key left a full cluster running and the run reported failure.
      - |
        KEY="{{.KEY}}"; KEY="${KEY/#\~/$HOME}"
        [ -f "$KEY" ] || {
          echo "✗ SSH key not found: $KEY" >&2
          echo "  It is needed by bootstrap-phase2, AFTER infra would have created" >&2
          echo "  billable resources — so this stops here. Pass KEY=/path/to/key." >&2
          exit 1
        }
        TFVARS="infrastructure/opentofu/cluster/envs/{{.ROLE}}-{{.PROVIDER}}.tfvars"
        [ -f "$TFVARS" ] || {
          echo "✗ no env file: $TFVARS" >&2
          echo "  Create it from the example, then edit it:" >&2
          echo "    cp $TFVARS.example $TFVARS" >&2
          exit 1
        }
        # The two keys are a PAIR and nothing else says so: bastion_ssh_keys is
        # the public half, injected by cloud-init; KEY is the private half the
        # tunnel authenticates with. A mismatch fails in phase 2 — after the
        # bill — with an SSH error naming neither file. Skipped silently when
        # the public half cannot be derived (a passphrase-protected key), because
        # refusing to deploy over a check we could not run is worse.
        PUB="$(ssh-keygen -y -f "$KEY" 2>/dev/null | awk '{print $2}')" || true
        if [ -n "$PUB" ] && ! grep -qF "$PUB" "$TFVARS"; then
          echo "✗ $KEY is not the private half of any key in bastion_ssh_keys." >&2
          echo "  The bastion would be built without it and phase 2 could not" >&2
          echo "  connect — after infra had spent. Add its public half:" >&2
          echo "    ssh-keygen -y -f $KEY" >&2
          echo "  to bastion_ssh_keys in $TFVARS, or pass the matching KEY=." >&2
          exit 1
        fi
        # The S3 credentials, HERE, not twenty lines into talos-image. Demonstrated
        # twice in three minutes on 2026-08-17: a shell that had not sourced .env.sh
        # passed both guards above and died in the image build.
        #
        # This used to ask s3_cred whether a key was non-empty — which it ALWAYS is,
        # because the backup keys fall back to the primary's. A check that cannot
        # fail: on 2026-08-19 it passed a cluster whose replica pointed at another
        # cloud with a stale key, and the deploy died four minutes later, after a
        # full plan, on the same subject. ensure-buckets actually TALKS to both
        # stores, so "the credentials work" is measured rather than assumed. It is
        # idempotent and runs again inside infra-apply; here it costs a few HEAD
        # requests and moves the refusal before anything is built.
        if [ -z "$(./scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} ak primary 2>/dev/null)" ]; then
          echo "✗ no S3 credentials for '{{.PROVIDER}}'." >&2
          echo "  Did you 'source .env.sh'? Every cloud task needs it, and nothing" >&2
          echo "  else in this shell will tell you it is missing until it costs time." >&2
          exit 1
        fi
        # --preflight adds prod's replica-on-another-cloud rule, for a cluster
        # with no state object yet. Only here: infra-apply, which cluster-upgrade
        # and converge-versions call, must keep working on a deployed cluster.
        ./scripts/internal/ensure-buckets.sh "$TFVARS" --preflight || exit 1
        # The passphrase encrypts the state and both access artifacts, and NOTHING
        # else checks it: without it `tofu` stops to prompt, and with the shipped
        # placeholder — long enough to pass the only validation there is — it
        # deploys happily under a secret published in this repository.
        case "${TF_VAR_encryption_passphrase:-}" in
          "") echo "✗ TF_VAR_encryption_passphrase is not set — tofu would stop and prompt for it." >&2; exit 1 ;;
          *change-me*) echo "✗ TF_VAR_encryption_passphrase is still the example from .env.example." >&2
                       echo "  It is public. Replace it: openssl rand -base64 48" >&2; exit 1 ;;
        esac
      - task: image-build
        vars:
          PROVIDER: "{{.PROVIDER}}"
          VERSION: "{{.VERSION}}"
          ENSURE: "1"
      - |
        CILIUM=infrastructure/opentofu/cluster/bootstrap-manifests/cilium.yaml
        if [ "{{.FORCE}}" = "1" ] || [ ! -s "$CILIUM" ] || grep -q "CILIUM-MANIFEST-PLACEHOLDER" "$CILIUM"; then
          ./scripts/bootstrap/render-bootstrap-manifests.sh
        else
          echo "✓ bootstrap manifests already rendered — skipping (FORCE=1 to re-render)"
        fi
      # What the plan below CANNOT show. `ignore_changes` on the node image keeps a
      # version roll out of the OpenTofu plan entirely, so an operator reading that
      # plan would approve a bring-up and get every node rolled without ever having
      # seen it. Best effort: with no cluster yet there is nothing to read and this
      # says nothing. It deliberately does NOT refresh kubeconfig first — `tofu
      # output` failing truncates the file it writes to, and overwriting a good
      # kubeconfig to print a notice is a bad trade.
      - ./scripts/internal/converge-versions.sh {{.PROVIDER}} {{.ROLE}} {{.KEY}} --check
      # ONE human checkpoint on the whole journey, and it is here — the step that
      # spends. `up` plans, shows it, asks once, then applies EXACTLY that plan:
      # never two different plans, and never a silent apply. APPROVE=auto skips the
      # question, which is what CI and a shell with no terminal need; without a
      # terminal and without APPROVE it stops with the plan saved and names the one
      # command that lands it.
      - |
        PLANFILE="up-{{.ROLE}}-{{.PROVIDER}}.tfplan"
        task infra-plan ROLE={{.ROLE}} PROVIDER={{.PROVIDER}} KEY={{.KEY}} OUT="$PLANFILE" || exit 1
        if [ "{{.APPROVE}}" != auto ]; then
          if [ -t 0 ]; then
            printf '\nApply this plan? Only "yes" is accepted: '
            read -r reply
            [ "$reply" = yes ] || {
              echo "✗ not applied. The plan is kept at cluster/$PLANFILE"; exit 1; }
          else
            echo "✗ no terminal, and no APPROVE=auto — nothing was applied." >&2
            echo "  The plan above is saved. Read it, then land exactly it:" >&2
            echo "    task infra-apply ROLE={{.ROLE}} PROVIDER={{.PROVIDER}} KEY={{.KEY}} PLAN=$PLANFILE" >&2
            echo "  Or re-run the whole journey unattended: task cluster-up … APPROVE=auto" >&2
            exit 1
          fi
        fi
        task infra-apply ROLE={{.ROLE}} PROVIDER={{.PROVIDER}} KEY={{.KEY}} PLAN="$PLANFILE"
      - task: bootstrap-phase2
        vars:
          ROLE: "{{.ROLE}}"
          PROVIDER: "{{.PROVIDER}}"
          KEY: "{{.KEY}}"
          # Not passing this was the whole defect: cluster-up answered its own
          # gate and then let phase 2 ask a question nobody could hear.
          APPROVE: "{{.APPROVE}}"
      # rolling-replace hard-requires ./kubeconfig and ./talosconfig in the cluster
      # directory, and nothing above has written either of them.
      - task: kubeconfig
        vars:
          ROLE: "{{.ROLE}}"
          PROVIDER: "{{.PROVIDER}}"
      # Editing the tfvars IS the decision to upgrade, so the command that reads it
      # has to reach it. APPROVE=auto inside is not a bypass: the one checkpoint
      # above already asked, and --check had told it what this would roll.
      - ./scripts/internal/converge-versions.sh {{.PROVIDER}} {{.ROLE}} {{.KEY}}
      # The verdict, asked of the cluster rather than assumed from the steps
      # above having run. go-task propagates this task's non-zero exit up
      # through cluster-up, so a failing verify halts here — the closing
      # echo below is only ever reached once it has passed.
      - task: cluster-verify
        vars:
          ROLE: "{{.ROLE}}"
          PROVIDER: "{{.PROVIDER}}"
      # Do NOT end on "every step above is idempotent": that line came out
      # identical on the first run, which applied 43 changes in phase 1 and 17 in
      # phase 2, and on the second, which applied none. Idempotence is a property
      # of the command, not a badge it awards itself — the evidence is OpenTofu's
      # own plan. A YAML comment, not a shell one: go-task echoes the block it
      # runs, so a `#` inside would be printed as the last thing the operator reads.
      - |
        echo "✓ cluster-up complete: cluster-verify passed."
        echo "  Run this exact command again to converge again."

  # ===========================================================================
  # Cluster Lifecycle
  #
  # infra / bootstrap-phase2 / destroy each take ROLE=management|workload (the
  # tfvars file is envs/<ROLE>-<PROVIDER>.tfvars).
  #
  # ROLE picks the FILE, and nothing else. The Flux overlay and the artifact
  # bucket segment come from `cluster_role` INSIDE that file — they coincide for
  # management/workload and diverge on purpose for the failover examples, which
  # are DR scenarios declaring cluster_role = "management". Any prefix with a
  # matching env file works; these two are simply the ones that ship.
  #
  # These used to be six
  # separate tasks (infra-management/infra-workload, management/workload,
  # destroy-management/destroy-workload) differing only in that filename.
  # ===========================================================================

  infra-apply:
    aliases: [infra, apply-plan]
    desc: >-
      Apply the infrastructure. Give it a PLAN you have read — `task infra-plan PROVIDER=… OUT=f`
      then `task infra-apply PROVIDER=… PLAN=f` — or APPROVE=auto to compute and apply in one step
      without a question. With neither it refuses: it will not guess, and it will not prompt.
      Usage: task infra-apply PROVIDER=… [ROLE=…] [PLAN=f | APPROVE=auto] [KEY=…]
    dir: infrastructure/opentofu/cluster
    # PROVIDER is REQUIRED, not defaulted. Twenty targets used to fall back to
    # scaleway in silence — including destroy and down — so a command typed
    # while working on another cloud aimed at the wrong account. The refusal is
    # the documentation: it names the variable instead of guessing.
    requires:
      vars: [PROVIDER]
    preconditions: *refuse-local
    vars:
      ROLE: '{{.ROLE | default "management"}}'
      # Only used to REBUILD a tunnel the guard below finds broken; an apply on a
      # cluster whose tunnels are healthy never reads it.
      KEY: '{{.KEY | default "~/.ssh/id_ed25519"}}'
      PLAN: '{{.PLAN | default ""}}'
      # ask | auto — the value names WHO answers the approval, never whether
      # there is one: every apply still plans, then applies that saved plan.
      APPROVE: '{{.APPROVE | default "ask"}}'
    env: &provider-env
      # One source directory, several clusters — and .terraform/ holds the CURRENT
      # backend, so whichever target inited last owned it. Two runs on different
      # providers then stole it from each other; survived twice by luck on
      # 2026-08-19 and 2026-08-20. TF_DATA_DIR relocates that per-directory data,
      # VERIFIED offline: two inits on different backends in one source directory
      # each keep their own pointer. Keyed on ROLE-PROVIDER because that is
      # exactly how the tfvars — and therefore the backend — are selected.
      TF_DATA_DIR: '.terraform-{{.ROLE}}-{{.PROVIDER}}'
      AWS_ACCESS_KEY_ID:
        sh: ../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} ak
      AWS_SECRET_ACCESS_KEY:
        sh: ../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} sk
      TF_VAR_outscale_access_key_id:
        sh: '[ "{{.PROVIDER}}" = outscale ] && ../../../scripts/internal/resolve-s3-cred.sh outscale ak || true'
      TF_VAR_outscale_secret_key_id:
        sh: '[ "{{.PROVIDER}}" = outscale ] && ../../../scripts/internal/resolve-s3-cred.sh outscale sk || true'
    cmds:
      - |
        # Two ways in, and NEITHER of them is a prompt.
        #
        # PLAN= applies a file you have already read, and OpenTofu refuses it if
        # the state moved since — so what you reviewed is what runs. APPROVE=auto says
        # "compute it and apply it, do not ask", which is what CI and a shell
        # with no terminal need. With neither, this refuses: an apply that can
        # replace nodes should never happen because a default was convenient.
        if [ -z "{{.PLAN}}" ] && [ "{{.APPROVE}}" != auto ]; then
          echo "✗ nothing told me to apply anything." >&2
          echo "  Read a plan first, then apply exactly it:" >&2
          echo "    task infra-plan  PROVIDER={{.PROVIDER}} ROLE={{.ROLE}} OUT=tfplan" >&2
          echo "    task infra-apply PROVIDER={{.PROVIDER}} ROLE={{.ROLE}} PLAN=tfplan" >&2
          echo "  Or, for CI and unattended runs, compute and apply in one step:" >&2
          echo "    task infra-apply PROVIDER={{.PROVIDER}} ROLE={{.ROLE}} APPROVE=auto" >&2
          exit 1
        fi
      # FIRST, before anything that can fail: the explainer below reads this
      # file, and a transcript left by the previous run would diagnose that one.
      - rm -f .tofu-run.log
      # Only on failure — EXIT_CODE is empty when the task succeeded (verified on
      # Task 3.52). An apply that times out mid-creation leaves the resource
      # TAINTED, so the obvious "just re-run" destroys what the provider was
      # still building. Nothing said the word "tainted" on 2026-08-18 and that
      # cost an hour of rebuilding an OVH load balancer at ten minutes a go.
      - defer: '{{if .EXIT_CODE}}../../../scripts/internal/explain-failure.sh .{{else}}true{{end}}'
      - ../../../scripts/internal/ensure-buckets.sh envs/{{.ROLE}}-{{.PROVIDER}}.tfvars
      - tofu init -reconfigure $(../../../scripts/internal/tf-backend.sh envs/{{.ROLE}}-{{.PROVIDER}}.tfvars)
      - |
        # tee, so the defer above can quote the provider on a failure state alone
        # cannot explain (a 404 on an object it still holds). pipefail is what
        # stops tee reporting success for a failed plan — measured on Task 3.52.
        set -o pipefail
        # Idempotency guard: control_plane_count/worker_count (cluster/main.tf) are
        # gated by talos_bootstrap, so forcing =false here on an ALREADY-bootstrapped
        # cluster zeroes them and drops talos_machine_bootstrap et al. from state —
        # bootstrap-phase2 then recreates them, re-sending the bootstrap RPC against
        # a live etcd, which Talos correctly refuses (AlreadyExists) and which also
        # invalidates the kubeconfig output. Found live 2026-07-30 re-running `task
        # up` for an idempotency test. Only a truly fresh cluster gets false.
        if tofu state list 2>/dev/null | grep -q 'module.talos.talos_machine_bootstrap'; then
          TB=true
        else
          TB=false
        fi
        # TB=true means module.talos is in play, and every one of its resources
        # speaks to the Talos API through the localhost tunnels. With them shut the
        # apply does not fail — it WAITS: data.talos_cluster_health reads for 15m,
        # and each replaced talos_machine_configuration_apply burns its own 15m
        # dialling a closed port. Measured 2026-08-18 on Outscale: six of them,
        # printing nothing but "Still creating...", on an upgrade that needed a
        # human to read the provider's API by hand before it could continue.
        # `ensure` answers in about a second, touches nothing when the tunnels are
        # healthy, and rebuilds only what is broken. It runs AFTER the init above,
        # so `tofu output` has its backend, and it never inits anything itself.
        if [ "$TB" = true ] && [ "${OA_SKIP_TUNNEL_GUARD:-}" != 1 ]; then
          SSH_KEY="{{.KEY}}" ../../../scripts/bootstrap/talos-tunnels.sh ensure . || exit 1
        fi
        if [ -n "{{.PLAN}}" ]; then
          # A saved plan carries its own variables; passing -var-file with one is
          # an error, and the backend must be the one it was planned against.
          [ -f "{{.PLAN}}" ] || {
            echo "✗ no plan file {{.PLAN}} — create one with:" >&2
            echo "    task infra-plan PROVIDER={{.PROVIDER}} ROLE={{.ROLE}} OUT={{.PLAN}}" >&2
            exit 1
          }
          tofu apply "{{.PLAN}}" 2>&1 | tee -a .tofu-run.log
          rm -f "{{.PLAN}}"
        else
          # APPROVE=auto without a PLAN. It still PLANS, and it still applies THAT
          # plan — APPROVE answers the question, it does not delete the question.
          # -auto-approve would: there would be no plan artifact, nothing frozen
          # between the reading and the doing, and no way for OpenTofu to refuse
          # a plan whose state has moved. The saved-plan path gives all three,
          # and `tofu apply <file>` never prompts, so the only yes is ours.
          P="auto-{{.ROLE}}-{{.PROVIDER}}.tfplan"
          tofu plan -out="$P" -var-file="envs/{{.ROLE}}-{{.PROVIDER}}.tfvars" \
            -var talos_bootstrap=$TB 2>&1 | tee -a .tofu-run.log
          tofu apply "$P" 2>&1 | tee -a .tofu-run.log
          rm -f "$P"
        fi
      - task: _backup-state
        vars: {PROVIDER: "{{.PROVIDER}}"}

  infra-plan:
    aliases: [plan]
    desc: >-
      Plan a cluster root without applying. STRICT=1 makes a non-empty plan an ERROR (exit 2) — that is the
      "converged" assertion an idempotency or post-upgrade check needs. Usage: task plan
      ROLE=management|workload [PROVIDER=scaleway|ovh|outscale|proxmox] [STRICT=1]
    dir: infrastructure/opentofu/cluster
    # PROVIDER is REQUIRED, not defaulted. Twenty targets used to fall back to
    # scaleway in silence — including destroy and down — so a command typed
    # while working on another cloud aimed at the wrong account. The refusal is
    # the documentation: it names the variable instead of guessing.
    requires:
      vars: [PROVIDER]
    preconditions: *refuse-local
    vars:
      ROLE: '{{.ROLE | default "management"}}'
      KEY: '{{.KEY | default "~/.ssh/id_ed25519"}}'
    env: *provider-env
    cmds:
      # Dropped first, for the same reason as in `infra-apply`: a stale
      # transcript would make the explainer diagnose the run before this one.
      - rm -f .tofu-run.log
      # A PLAN fails too, and until 2026-08-19 only `infra-apply` explained it.
      # That day a plan died on a load balancer OpenTofu still had in state and
      # Scaleway had already deleted — "waiting for lb failed: 404" — naming
      # neither the ghost nor `tofu state rm`. Nothing tried to explain it,
      # because the explainer was wired to the other target.
      - defer: '{{if .EXIT_CODE}}../../../scripts/internal/explain-failure.sh .{{else}}true{{end}}'
      - tofu init -reconfigure $(../../../scripts/internal/tf-backend.sh envs/{{.ROLE}}-{{.PROVIDER}}.tfvars)
      - |
        # Same talos_bootstrap resolution as `infra`: passing the phase-1 value to
        # an already-bootstrapped cluster zeroes the node counts and the plan then
        # describes a teardown nobody asked for.
        if tofu state list 2>/dev/null | grep -q 'module.talos.talos_machine_bootstrap'; then
          TB=true
        else
          TB=false
        fi
        # On a bootstrapped cluster this plan reads data.talos_cluster_health,
        # whose endpoints are localhost tunnels — so from a shell that did not open
        # them it waits out health_check_timeout and dies on "cluster health check
        # failed", naming neither the tunnels nor the cause. MEASURED on a live
        # Scaleway cluster, 2026-08-17: 15m10s to reach that message.
        #
        # This used to refuse, after testing ONE of the six ports with `nc -z` —
        # which cannot tell a live endpoint from a dead one, because ssh -L keeps
        # listening after the connection through it dies (measured, offline:
        # scripts/dev/test-endpoint-probe.sh). `ensure` tests all six, demands a
        # TLS answer, and repairs instead of refusing.
        if [ "$TB" = true ] && [ "${OA_SKIP_TUNNEL_GUARD:-}" != 1 ]; then
          SSH_KEY="{{.KEY}}" ../../../scripts/bootstrap/talos-tunnels.sh ensure . || exit 1
        fi
        # -detailed-exitcode: 0 = no changes, 2 = changes, 1 = error. Task fails on
        # any non-zero, which is what turns "the plan is empty" into an assertion.
        # OUT= saves the plan so it can be APPLIED, not merely read. Without it
        # "review the plan, then apply" is two different plans: OpenTofu says so
        # itself — "you didn't use the -out option, so OpenTofu can't guarantee to
        # take exactly these actions". Reviewing one and applying another is not a
        # review, and `-auto-approve` after a separate plan is exactly that.
        # Interactive `tofu apply` is sound because it shows and applies the SAME
        # in-memory plan; this is for every case where nobody is watching.
        # tee + pipefail: the transcript is the only record of the provider's
        # own words, and pipefail keeps -detailed-exitcode's 0/1/2 intact
        # through the pipe (measured on Task 3.52, including the 2).
        set -o pipefail
        tofu plan {{if eq .STRICT "1"}}-detailed-exitcode{{end}} {{if .OUT}}-out="{{.OUT}}"{{end}} \
          -var-file="envs/{{.ROLE}}-{{.PROVIDER}}.tfvars" -var talos_bootstrap=$TB 2>&1 | tee -a .tofu-run.log

  tunnels-up:
    aliases: [tunnels]
    desc: >-
      Open the per-node Talos API tunnels through the bastion (control planes on 50000+i, workers on
      50100+i). Needed by `task plan` and by talosctl on a bootstrapped cluster. Usage:
      task tunnels PROVIDER=scaleway [ROLE=management] [KEY=~/.ssh/yourkey] — then `task close-tunnels`.
    dir: infrastructure/opentofu/cluster
    # PROVIDER is REQUIRED, not defaulted. Twenty targets used to fall back to
    # scaleway in silence — including destroy and down — so a command typed
    # while working on another cloud aimed at the wrong account. The refusal is
    # the documentation: it names the variable instead of guessing.
    requires:
      vars: [PROVIDER]
    preconditions: *refuse-local
    vars:
      ROLE: '{{.ROLE | default "management"}}'
      KEY: '{{.KEY | default "~/.ssh/id_ed25519"}}'
    env: *provider-env
    cmds:
      # The init is what makes this runnable from a cold shell. Called by hand,
      # talos-tunnels.sh reads `tofu output -json` with no backend and no
      # credentials, falls back to `{}` and reports "No bastion_ip in the state —
      # deploy the infrastructure first" against a cluster that is running. That
      # message sent a reader looking for a deployment bug for the length of the
      # search. Verified 2026-08-17 on a live cluster.
      - tofu init -reconfigure $(../../../scripts/internal/tf-backend.sh envs/{{.ROLE}}-{{.PROVIDER}}.tfvars)
      - SSH_KEY="{{.KEY}}" ../../../scripts/bootstrap/talos-tunnels.sh open .

  bootstrap-phase2:
    desc: >-
      Phase 2: open SSH tunnels (from state) + bootstrap Talos. It computes its OWN plan and
      needs an approval — APPROVE=auto answers it, for CI and for a shell that cannot be asked.
      Usage: task bootstrap-phase2 ROLE=management|workload
      [PROVIDER=scaleway|ovh|outscale|proxmox] [KEY=~/.ssh/yourkey] [APPROVE=auto]
    dir: infrastructure/opentofu/cluster
    vars:
      ROLE: '{{.ROLE | default "management"}}'
      PROVIDER: '{{.PROVIDER | default "scaleway"}}'
      KEY: '{{.KEY | default "~/.ssh/id_ed25519"}}'
      # ask | auto — the value names WHO answers the approval, never whether
      # there is one: every apply still plans, then applies that saved plan.
      APPROVE: '{{.APPROVE | default "ask"}}'
    env: *provider-env
    cmds:
      - tofu init -reconfigure $(../../../scripts/internal/tf-backend.sh envs/{{.ROLE}}-{{.PROVIDER}}.tfvars)
      - SSH_KEY="{{.KEY}}" ../../../scripts/bootstrap/talos-tunnels.sh open .
      - |
        # Phase 2 cannot reuse the phase-1 plan: that one was computed with
        # talos_bootstrap=false, which gates the node counts to zero. So it
        # plans again, and the approval lives HERE.
        #
        # Without APPROVE and without a terminal this used to die on OpenTofu's
        # "error asking for approval: EOF", which names neither the cause nor
        # the knob. MEASURED 2026-08-19: three runs of `cluster-up … APPROVE=auto`
        # stopped exactly here, each AFTER phase 1 had already spent — because
        # cluster-up did not pass APPROVE down. A journey advertised as unattended
        # could not complete unattended.
        # PLAN, then apply THAT plan, and the yes in between is answered by a
        # human or by APPROVE=auto. Never -auto-approve: that removes the approval
        # rather than answering it. `tofu apply <saved-plan>` does not prompt,
        # so this gate is the only one — and OpenTofu refuses a saved plan whose
        # state has moved, which is what makes "what I read is what ran" true.
        PLANFILE="phase2-{{.ROLE}}-{{.PROVIDER}}.tfplan"
        tofu plan -out="$PLANFILE" -var-file="envs/{{.ROLE}}-{{.PROVIDER}}.tfvars" -var talos_bootstrap=true
        if [ "{{.APPROVE}}" != auto ]; then
          if [ -t 0 ]; then
            printf '\nApply this plan? Only "yes" is accepted: '
            read -r reply
            [ "$reply" = yes ] || {
              echo "✗ not applied. The plan is kept at cluster/$PLANFILE"; exit 1; }
          else
            echo "✗ no terminal, and no APPROVE=auto — nothing was applied." >&2
            echo "  Phase 1 is already applied; this only bootstraps Talos on it." >&2
            echo "  The plan above is saved. Read it, then land exactly it:" >&2
            echo "    cd infrastructure/opentofu/cluster && tofu apply $PLANFILE" >&2
            echo "  Or re-run the journey unattended: task cluster-up PROVIDER={{.PROVIDER}} … APPROVE=auto" >&2
            exit 1
          fi
        fi
        tofu apply "$PLANFILE"
        rm -f "$PLANFILE"
      - task: _backup-state
        vars: {PROVIDER: "{{.PROVIDER}}"}

  cluster-roll:
    aliases: [rolling-replace]
    desc: >-
      Replace nodes one at a time (drain→targeted apply→wait) with NO downtime. Use for a node size or image
      change (instance_type / flavor_name / cpu / memory / Talos image) instead of infra, which applies it to
      all nodes in parallel and breaks etcd quorum. Targets are derived from `tofu state list` —
      provider-agnostic; --upgrade exercised live on Scaleway, OVH and Outscale. ROLE picks the env file and
      the state, and defaults to management.
      Usage: task cluster-roll PROVIDER=… [ROLE=management|workload] [KEY=~/.ssh/key] [APPROVE=auto]
      [-- --workers-only|--cp-only|--dry-run|--upgrade]
    dir: infrastructure/opentofu/cluster
    # PROVIDER is REQUIRED, not defaulted. Twenty targets used to fall back to
    # scaleway in silence — including destroy and down — so a command typed
    # while working on another cloud aimed at the wrong account. The refusal is
    # the documentation: it names the variable instead of guessing.
    requires:
      vars: [PROVIDER]
    preconditions: *refuse-local
    vars:
      ROLE: '{{.ROLE | default "management"}}'
      KEY: '{{.KEY | default "~/.ssh/id_ed25519"}}'
      # One word for "do not ask me", the same one infra-apply uses. It used to be
      # a `--yes` buried in CLI_ARGS, which meant three different spellings of the
      # same intent across the repository.
      # ask | auto — the value names WHO answers the approval, never whether
      # there is one: every apply still plans, then applies that saved plan.
      APPROVE: '{{.APPROVE | default "ask"}}'
    env: *provider-env
    cmds:
      - tofu init -reconfigure $(../../../scripts/internal/tf-backend.sh envs/{{.ROLE}}-{{.PROVIDER}}.tfvars)
      - SSH_KEY="{{.KEY}}" ../../../scripts/bootstrap/talos-tunnels.sh open .
      # --role BEFORE CLI_ARGS: a role passed by the caller in `-- …` then wins,
      # which is the ordering every other flag here already has.
      - >-
        ../../../scripts/ops/rolling-replace.sh {{.PROVIDER}} --role={{.ROLE}}
        {{if eq .APPROVE "auto"}}--yes {{end}}{{.CLI_ARGS}}
      - task: _backup-state
        vars: {PROVIDER: "{{.PROVIDER}}"}

  infra-down-plan:
    desc: >-
      Compute the DESTRUCTION plan and write it to a file. Read it, then apply exactly it with
      `task infra-down PROVIDER=… PLAN=f`. There is no one-command destroy, on purpose.
      Usage: task infra-down-plan PROVIDER=… [ROLE=management] [OUT=destroy.tfplan]
    dir: infrastructure/opentofu/cluster
    requires:
      vars: [PROVIDER]
    preconditions: *refuse-local
    vars:
      ROLE: '{{.ROLE | default "management"}}'
      OUT: '{{.OUT | default "destroy.tfplan"}}'
    env: *provider-env
    cmds:
      - tofu init -reconfigure $(../../../scripts/internal/tf-backend.sh envs/{{.ROLE}}-{{.PROVIDER}}.tfvars)
      # ⚠️ NOT purely read-only, and the one wart in this two-step design.
      # machine_secrets carries prevent_destroy — the PKI is the cluster's root of
      # trust — and OpenTofu enforces that at PLAN time, not at apply. So the plan
      # cannot be computed while the resource is tracked. This detaches it from
      # state, exactly as the old one-shot destroy did, only now it happens at the
      # planning step. If you read the plan and change your mind, the cluster still
      # runs and its PKI is untouched on the nodes — but the state no longer tracks
      # that resource.
      - |
        echo "⚠ untracking module.talos.talos_machine_secrets so the destroy plan can be computed."
        echo "  The PKI on the nodes is untouched; the state stops tracking it."
      - tofu state rm module.talos.talos_machine_secrets.this 2>/dev/null || true
      # talos_bootstrap=false resolves module.talos to count=0, so the plan skips
      # data.talos_cluster_health — which would otherwise read through the SSH
      # tunnels and hang if they are already closed.
      - |
        # A teardown must never be blocked by a provider that will not answer.
        # The Outscale provider's READ of a load balancer WAITS for it to become
        # active, so an LBU stuck in `provisioning` makes every refresh — and
        # therefore every destroy plan — time out. Measured 2026-08-19: 5m0s per
        # attempt, and the LBU was still `provisioning` two hours later. Without
        # a fallback the account keeps billing because it cannot be planned.
        #
        # The refresh is still tried FIRST: a plan built on stale state can name
        # resources the provider already removed, and reading beats guessing.
        # The fallback is the exit, not the default.
        VARS="envs/{{.ROLE}}-{{.PROVIDER}}.tfvars"
        if tofu plan -destroy -out="{{.OUT}}" -var-file="$VARS" -var talos_bootstrap=false; then
          exit 0
        fi
        echo "⚠ the refresh failed — replanning from state alone (-refresh=false)." >&2
        echo "  Something here no longer answers its provider. The plan below is built" >&2
        echo "  from what the STATE records, so read it: it may name resources that are" >&2
        echo "  already gone, and it will not notice one that drifted." >&2
        tofu plan -destroy -refresh=false -out="{{.OUT}}" -var-file="$VARS" -var talos_bootstrap=false
      - |
        # Silent when something else is driving. Called from fleet-down, this
        # printed its own next step right above fleet-down's — two commands for
        # one action, at two different levels, and following the inner one SKIPS
        # the CAPI-children step that cluster-down exists to enforce. An operator
        # asked which of the two to run, which is the answer.
        if [ "${OA_DRIVEN_BY:-}" = "" ]; then
          echo
          echo "✓ destruction plan written to {{.OUT}}. Nothing has been destroyed."
          echo "  Read it, then apply exactly it:"
          echo "    task infra-down PROVIDER={{.PROVIDER}} ROLE={{.ROLE}} PLAN={{.OUT}}"
        else
          echo
          echo "✓ destruction plan written to {{.OUT}}. Nothing has been destroyed."
        fi

  infra-down:
    aliases: [destroy]
    desc: >-
      Destroy a cluster by applying a plan you have already read. REQUIRES PLAN= — there is no
      one-command destroy, and APPROVE=auto, --yes, force and TF_CLI_ARGS_destroy cannot create one.
      Usage: task infra-down-plan PROVIDER=…, read it, then task infra-down PROVIDER=… PLAN=f
    dir: infrastructure/opentofu/cluster
    requires:
      vars: [PROVIDER]
    preconditions: *refuse-local
    vars:
      ROLE: '{{.ROLE | default "management"}}'
      PLAN: '{{.PLAN | default ""}}'
    env: *provider-env
    cmds:
      - |
        # THE POINT OF THIS TARGET. Destroying a cluster must take two deliberate
        # commands, so that no single mistyped line — and no environment variable
        # inherited from somewhere else — can do it. APPROVE=auto works on infra-apply
        # and is DELIBERATELY inert here.
        if [ -z "{{.PLAN}}" ]; then
          echo "✗ refusing to destroy without a plan you have read." >&2
          echo "  This takes two commands, always:" >&2
          echo "    task infra-down-plan PROVIDER={{.PROVIDER}} ROLE={{.ROLE}}" >&2
          echo "    task infra-down      PROVIDER={{.PROVIDER}} ROLE={{.ROLE}} PLAN=destroy.tfplan" >&2
          echo "  APPROVE=auto does not apply here, and neither does TF_CLI_ARGS_destroy." >&2
          exit 1
        fi
        [ -f "{{.PLAN}}" ] || { echo "✗ no plan file {{.PLAN}} — run task infra-down-plan first." >&2; exit 1; }
        # A plan file that CREATES things is not a destroy plan, and applying one
        # here would be the opposite of what the operator asked for.
        if ! tofu show -json "{{.PLAN}}" 2>/dev/null | grep -q '"actions":\["delete"\]'; then
          echo "✗ {{.PLAN}} contains no deletions — this is not a destruction plan." >&2
          echo "  Regenerate it: task infra-down-plan PROVIDER={{.PROVIDER}} ROLE={{.ROLE}}" >&2
          exit 1
        fi
      - tofu init -reconfigure $(../../../scripts/internal/tf-backend.sh envs/{{.ROLE}}-{{.PROVIDER}}.tfvars)
      # Exactly the plan that was read. OpenTofu refuses a saved plan whose state
      # has moved since, so nothing can have changed under it in the meantime.
      - tofu apply "{{.PLAN}}"
      - rm -f "{{.PLAN}}"
      # The cluster is gone; its tunnels are not. Twelve were still listening
      # after three teardowns on 2026-08-15, forwarding to bastions that no
      # longer existed — and a stale listener reads as "up" to the next deploy's
      # check. Scoped to this cluster's own port block by TALOS_TUNNEL_OFFSET.
      - ../../../scripts/bootstrap/talos-tunnels.sh close .

  tunnels-down:
    aliases: [close-tunnels]
    desc: "Close the Talos API SSH tunnels opened for Phase 2"
    cmds:
      - ./scripts/bootstrap/talos-tunnels.sh close infrastructure/opentofu/cluster

  talosconfig-new:
    desc: >-
      Issue a short-lived, role-scoped talosconfig from the admin one — the deploy hands out
      os:admin valid a YEAR, and read-only work does not need it.
      Usage: task talosconfig-new PROVIDER=scaleway [ROLES=os:reader] [TTL=8h]
    # PROVIDER is REQUIRED, not defaulted — see cluster-upgrade above for why.
    requires:
      vars: [PROVIDER]
    # The Docker lane has its own name for this, and it is `task local-rbac`,
    # which mints one as part of proving the roles are enforced.
    preconditions: *refuse-local
    vars:
      ROLES: '{{.ROLES | default "os:reader"}}'
      TTL: '{{.TTL | default "8h"}}'
    # ⚠️ Proven on the Docker lane only (task local-rbac). On a cloud lane the
    # Talos API is reached through the bastion, so the tunnels must be open —
    # `task tunnels-up PROVIDER=…` first. That path has never been run.
    cmds:
      - ./scripts/ops/talosconfig-new.sh {{.PROVIDER}} --roles {{.ROLES}} --ttl {{.TTL}}

  backup-state:
    desc: >-
      Replicate the (encrypted) tfstate to the -backup store (post-apply). Set BACKUP_AWS_* for a cross-provider
      replica. Usage: task backup-state [PROVIDER=scaleway|ovh|outscale|proxmox]
    # `dir:` is NOT cosmetic here: the *provider-env anchor resolves the S3
    # credentials with `../../../scripts/...`, a path that is only correct from
    # infrastructure/opentofu/cluster. Without it every use of this target exits
    # 127 before running anything — so the documented way to re-replicate the
    # state, which is one of this release's five promises, could not execute.
    dir: infrastructure/opentofu/cluster
    # PROVIDER is REQUIRED, not defaulted. Twenty targets used to fall back to
    # scaleway in silence — including destroy and down — so a command typed
    # while working on another cloud aimed at the wrong account. The refusal is
    # the documentation: it names the variable instead of guessing.
    requires:
      vars: [PROVIDER]
    preconditions: *refuse-local
    vars:
      ROLE: '{{.ROLE | default "management"}}'
    env: *provider-env
    cmds:
      - ../../../scripts/ops/backup-state.sh .

  edge-down:
    desc: >-
      CLEAN decommission of a CAPI child cluster (idempotent). Run it BEFORE removing
      the file from apps/clusters/kustomization.yaml: a bare Flux prune deletes
      everything out of order and stalls the CAPI cascade (orphaned VMs, billed).
      Usage: task edge-down CLUSTER=edge-1 [NS=capi-clusters] [TIMEOUT=900] [-- --yes]
    vars:
      CLUSTER: '{{.CLUSTER}}'
      NS: '{{.NS | default "capi-clusters"}}'
      TIMEOUT: '{{.TIMEOUT | default "900"}}'
    preconditions:
      - sh: '[ -n "{{.CLUSTER}}" ]'
        msg: "CLUSTER= is required (e.g. task edge-down CLUSTER=edge-1)"
      - sh: '[ -n "$KUBECONFIG" ] || [ -f infrastructure/opentofu/cluster/kubeconfig ]'
        msg: "KUBECONFIG must point at the management cluster"
    cmds:
      - |
        export KUBECONFIG="${KUBECONFIG:-$PWD/infrastructure/opentofu/cluster/kubeconfig}"
        ./scripts/ops/edge-down.sh {{.CLUSTER}} --namespace {{.NS}} --timeout {{.TIMEOUT}} {{.CLI_ARGS}}

  cluster-down:
    aliases: [down, fleet-down]
    desc: >-
      COMPLETE, idempotent fleet teardown: every CAPI child cluster (edge-down,
      clean cascade) THEN the management (tofu destroy), then a report of what is
      left to purge by hand (buckets, images, keypairs). The order is not
      negotiable: a child outliving the management means orphaned, billed VMs.
      Two commands, always: `task cluster-down PROVIDER=…` computes a plan and destroys
      nothing, then `task cluster-down PROVIDER=… PLAN=f APPROVE=auto` lands exactly it.
      Usage: task cluster-down PROVIDER=ovh [ROLE=management] [PLAN=f] [APPROVE=auto]
    # PROVIDER is REQUIRED, not defaulted. Twenty targets used to fall back to
    # scaleway in silence — including destroy and down — so a command typed
    # while working on another cloud aimed at the wrong account. The refusal is
    # the documentation: it names the variable instead of guessing.
    requires:
      vars: [PROVIDER]
    preconditions: *refuse-local
    vars:
      ROLE: '{{.ROLE | default "management"}}'
      PLAN: '{{.PLAN | default ""}}'
      APPROVE: '{{.APPROVE | default "ask"}}'
    cmds:
      - |
        # The teardown was the one command that spoke a different language: six
        # dash-flags behind a bare `--` that Task otherwise keeps for itself,
        # while everything else took PROVIDER=, ROLE=, PLAN=, APPROVE=. Two
        # vocabularies in one tool is how an operator ends up reading the source
        # to destroy a cluster.
        #
        # The flags still work and are not deprecated: --force-no-edges is a
        # genuine escape hatch, CI passes them, and breaking those to tidy a
        # name would cost more than the name is worth. Anything spelled
        # explicitly after `--` wins, and nothing is synthesised on top of it.
        ARGS=""
        case "{{.CLI_ARGS}}" in
          *--plan*) : ;;
          *) if [ -n "{{.PLAN}}" ]; then ARGS="--plan-file {{.PLAN}}"; else ARGS="--plan"; fi ;;
        esac
        case "{{.CLI_ARGS}}" in
          *--yes*|*" -y"*) : ;;
          *) if [ "{{.APPROVE}}" = auto ]; then ARGS="$ARGS --yes"; fi ;;
        esac
        ./scripts/ops/fleet-down.sh {{.PROVIDER}} --role {{.ROLE}} $ARGS {{.CLI_ARGS}}

  etcd-snapshot:
    desc: >-
      Encrypted etcd snapshot → primary + replica buckets (client-side gpg AES-256, same passphrase as the
      tfstate; retention KEEP=30). GitOps makes etcd reconstructible — this is an RTO shortcut. Usage: task
      etcd-snapshot PROVIDER=scaleway|ovh|outscale|proxmox [KEY=~/.ssh/key] [KEEP=30]
    dir: infrastructure/opentofu/cluster
    # PROVIDER is REQUIRED, not defaulted. Twenty targets used to fall back to
    # scaleway in silence — including destroy and down — so a command typed
    # while working on another cloud aimed at the wrong account. The refusal is
    # the documentation: it names the variable instead of guessing.
    requires:
      vars: [PROVIDER]
    preconditions: *refuse-local
    vars:
      ROLE: '{{.ROLE | default "management"}}'
      KEY: '{{.KEY | default "~/.ssh/id_ed25519"}}'
      KEEP: '{{.KEEP | default "30"}}'
    env: *provider-env
    cmds:
      - tofu init -reconfigure $(../../../scripts/internal/tf-backend.sh envs/management-{{.PROVIDER}}.tfvars)
      - SSH_KEY="{{.KEY}}" ../../../scripts/bootstrap/talos-tunnels.sh open .
      - KEEP={{.KEEP}} ../../../scripts/ops/etcd-snapshot.sh

  _backup-state:
    internal: true
    dir: infrastructure/opentofu/cluster
    vars:
      ROLE: '{{.ROLE | default "management"}}'
      PROVIDER: '{{.PROVIDER | default "scaleway"}}'
    env: *provider-env
    cmds:
      # NOT swallowed. This used to end in `|| echo "⚠ …"`, so a replica that could
      # not be written cost one warning line in a wall of tofu output and the run
      # reported success — you believed you had a copy and had nothing. The script
      # already exits 0 by itself when there is legitimately nothing to replicate
      # yet (no backup_targets output), so a non-zero here means a real failure.
      - ../../../scripts/ops/backup-state.sh .

  render-manifests:
    desc: Render/update bootstrap manifests (Cilium + Flux)
    cmds:
      - ./scripts/bootstrap/render-bootstrap-manifests.sh

  check-alerts:
    desc: >-
      Check that every metric the alert rules read actually has data on the
      current cluster (KUBECONFIG). A rule on a metric nobody produces
      evaluates clean and never fires. Usage: task check-alerts [-- --strict]
    cmds:
      - python3 scripts/ops/check-alert-metrics.py {{.CLI_ARGS}}

  render-check:
    desc: "Check the committed bootstrap manifests against their generator (writes nothing)"
    cmds:
      # A generated artifact can diverge from its generator SILENTLY. It has
      # happened twice: `--set` flags hand-added into the artifact (including
      # socketLB.enabled on the local side, without which the webhooks break),
      # and a generator writing into a phantom directory. This check replays the
      # render into a throwaway directory and compares.
      - ./scripts/bootstrap/render-bootstrap-manifests.sh --check
      # A `--set` typo passes `helm template` silently (rc 0 — an unknown key
      # is just another value in .Values) and the check above only diffs the
      # render against itself, so regenerating after a typo is green too.
      # This reads the EFFECTIVE settings the committed ConfigMap carries.
      - python3 scripts/ops/check-cilium-effective-config.py

  check-flux-digests:
    desc: >-
      Resolve flux-install.yaml's 7 tag-pinned images to their ghcr.io digest and compare to
      upstream-artifacts.lock's sibling (#119). Needs the network, never a cloud account — not part
      of `task lint`, which must stay offline. Usage: task check-flux-digests [-- --write]
    cmds:
      - ./scripts/dev/check-flux-image-digests.sh {{.CLI_ARGS}}

  kubeconfig:
    desc: >-
      Retrieve kubeconfig/talosconfig from OpenTofu outputs (re-inits the backend, so this works from a cold
      shell). Usage: task kubeconfig ROLE=management|workload [PROVIDER=scaleway|ovh|outscale|proxmox]
    dir: infrastructure/opentofu/cluster
    # PROVIDER is REQUIRED, not defaulted. Twenty targets used to fall back to
    # scaleway in silence — including destroy and down — so a command typed
    # while working on another cloud aimed at the wrong account. The refusal is
    # the documentation: it names the variable instead of guessing.
    requires:
      vars: [PROVIDER]
    preconditions: *refuse-local
    vars:
      ROLE: '{{.ROLE | default "management"}}'
    env: *provider-env
    cmds:
      - tofu init -reconfigure $(../../../scripts/internal/tf-backend.sh envs/{{.ROLE}}-{{.PROVIDER}}.tfvars)
      - tofu output -raw kubeconfig > kubeconfig
      - tofu output -raw talosconfig > talosconfig
      - echo "KUBECONFIG and TALOSCONFIG written to infrastructure/opentofu/cluster/"

  state:
    desc: >-
      List what a cluster's OpenTofu state holds, or show one resource with ADDR=. It only reads
      the state; like `kubeconfig` it re-inits the local data dir, so a fresh shell works once
      .env.sh is sourced.
      Usage: task state PROVIDER=… [ROLE=management] [ADDR='module.x.type.name["key"]']
    dir: infrastructure/opentofu/cluster
    requires:
      vars: [PROVIDER]
    preconditions: *refuse-local
    silent: true
    vars:
      ROLE: '{{.ROLE | default "management"}}'
      ADDR: '{{.ADDR | default ""}}'
    env: *provider-env
    # go-task lets an AWS_* or TF_DATA_DIR already exported in the shell win over env:, so the cmd
    # exports again what its guard checked. Read-only: init, state list and state show are its tofu
    # verbs; test-state-task.sh fails on any other written here (not on an indirect call).
    cmds:
      - |
        set -eu
        # An exported TF_WORKSPACE picks another workspace: the wrong state, which tofu may even create.
        unset TF_WORKSPACE
        AK="$(../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} ak)" || AK=""
        SK="$(../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} sk)" || SK=""
        [ -n "$AK" ] || { echo "✗ no S3 access key for '{{.PROVIDER}}'. Did you 'source .env.sh'?" >&2; exit 1; }
        [ -n "$SK" ] || { echo "✗ no S3 secret key for '{{.PROVIDER}}'. Did you 'source .env.sh'?" >&2; exit 1; }
        export AWS_ACCESS_KEY_ID="$AK" AWS_SECRET_ACCESS_KEY="$SK" TF_DATA_DIR='.terraform-{{.ROLE}}-{{.PROVIDER}}'
        [ -n "${TF_VAR_encryption_passphrase:-}" ] || {
          echo "✗ TF_VAR_encryption_passphrase is not set, and the state is encrypted with it." >&2; exit 1; }
        # Captured first, under set -e: inside `tofu init $(...)` a failure is lost and init runs bare.
        BACKEND="$(../../../scripts/internal/tf-backend.sh envs/{{.ROLE}}-{{.PROVIDER}}.tfvars)"
        # init's progress goes to stderr, so stdout is the answer alone and pipes into grep.
        tofu init -reconfigure -input=false $BACKEND >&2
        echo "→ state at ${BACKEND//-backend-config=/}" >&2
        # Listed with ADDR= too: by hand, a wrong directory, data dir or key answers "No state file
        # was found", which reads as an empty state or a mistyped address.
        OUT="$(tofu state list)" || {
          echo "✗ if tofu said 'No state file was found', nothing is stored at that key: the env" >&2
          echo "  file's cluster_name, environment or bucket_suffix is not what was deployed." >&2
          exit 1; }
        {{if .ADDR}}
        tofu state show {{shellQuote .ADDR}}
        {{else}}
        if [ -n "$OUT" ]; then printf '%s\n' "$OUT"; else echo "✓ the state exists and holds no resources." >&2; fi
        {{end}}

  restore-artifacts:
    desc: >-
      Recover kubeconfig + talosconfig from the encrypted backups. Usage:
      task restore-artifacts PROVIDER=scaleway [ROLE=management] [FROM=primary|replica] [FORCE=1]
      FROM=replica reads the cross-provider copy — the one that answers when the cluster's own cloud does not.
    dir: infrastructure/opentofu/cluster
    # PROVIDER is REQUIRED, not defaulted. Twenty targets used to fall back to
    # scaleway in silence — including destroy and down — so a command typed
    # while working on another cloud aimed at the wrong account. The refusal is
    # the documentation: it names the variable instead of guessing.
    requires:
      vars: [PROVIDER]
    preconditions: *refuse-local
    vars:
      ROLE: '{{.ROLE | default "management"}}'
      FROM: '{{.FROM | default "primary"}}'
      FORCE: '{{.FORCE | default ""}}'
    env: *provider-env
    cmds:
      - >-
        ../../../scripts/ops/restore-artifacts.sh {{.PROVIDER}}
        --role {{.ROLE}} --from {{.FROM}}{{if .FORCE}} --force{{end}}

  cluster-upgrade:
    aliases: [upgrade]
    desc: >-
      Upgrade Kubernetes then Talos on a running cluster, MEASURING the interruption instead of
      asserting there was none. Targets come from cluster/variables.tf; the tfvars is expected to pin
      one patch below. DRY_RUN=1 resolves the versions and stops, needing no cluster. Needs a terminal:
      the applies ask for approval. Usage: task upgrade PROVIDER=scaleway [ROLE=management] [KEY=~/.ssh/key]
    # PROVIDER is REQUIRED, not defaulted. Twenty targets used to fall back to
    # scaleway in silence — including destroy and down — so a command typed
    # while working on another cloud aimed at the wrong account. The refusal is
    # the documentation: it names the variable instead of guessing.
    requires:
      vars: [PROVIDER]
    preconditions: *refuse-local
    vars:
      ROLE: '{{.ROLE | default "management"}}'
      KEY: '{{.KEY | default "~/.ssh/id_ed25519"}}'
    cmds:
      # cluster-upgrade.sh was reachable from no target and from no workflow —
      # the same gap infra-verify.sh had until today. The script that defines
      # what an upgrade must prove could only be run by typing its path.
      - ./scripts/dev/cluster-upgrade.sh {{.PROVIDER}} {{.ROLE}} {{.KEY}}

  cluster-idempotency:
    desc: >-
      Re-run the bring-up on a live cluster and assert nothing moved: empty plan, the SAME nodes
      (names and creationTimestamps), a kubeconfig that still reaches the apiserver.
      Usage: task cluster-idempotency PROVIDER=… [ROLE=management] [KEY=~/.ssh/yourkey]
    # A second `task cluster-up` already says "No changes." on its own, and that
    # is the idempotence evidence — the property belongs to the command, not to
    # this target. What OpenTofu cannot see is the other two assertions: a node
    # replaced behind an identical plan, and the kubeconfig a re-run invalidated
    # on 2026-07-30. This existed only as a CI step until that lane was deleted.
    requires:
      vars: [PROVIDER]
    preconditions: *refuse-local
    vars:
      ROLE: '{{.ROLE | default "management"}}'
      KEY: '{{.KEY | default "~/.ssh/id_ed25519"}}'
    cmds:
      - ./scripts/dev/cluster-idempotency.sh {{.PROVIDER}} {{.ROLE}} {{.KEY}}

  cluster-verify:
    aliases: [verify]
    desc: >-
      Ask the CLUSTER whether it is what this release promises: apiserver up, every node Ready, the
      requested number of control planes, Cilium on each, CoreDNS serving, no Flux, no app load
      balancer, the Talos and Kubernetes versions the config pins, the schematic it pins, and
      a tfstate replica in the backup store. Usage: task verify PROVIDER=scaleway [ROLE=management]
    # See backup-state above: the *provider-env anchor needs this dir, and the
    # first version of this target shipped without it and exited 127 everywhere.
    dir: infrastructure/opentofu/cluster
    # PROVIDER is REQUIRED, not defaulted. Twenty targets used to fall back to
    # scaleway in silence — including destroy and down — so a command typed
    # while working on another cloud aimed at the wrong account. The refusal is
    # the documentation: it names the variable instead of guessing.
    requires:
      vars: [PROVIDER]
    preconditions: *refuse-local
    vars:
      ROLE: '{{.ROLE | default "management"}}'
    env: *provider-env
    cmds:
      # The script reads the state for the topology and the bucket names, so it
      # needs the backend and the S3 credentials — which is why it goes through a
      # task rather than being run by hand. It had no target at all until 0.5.0,
      # and its only caller was the upgrade lane: the one script that says what a
      # healthy cluster looks like was unreachable to the person deploying one.
      - task: kubeconfig
        vars: {ROLE: '{{.ROLE}}', PROVIDER: '{{.PROVIDER}}'}
      - ../../../scripts/dev/infra-verify.sh {{.PROVIDER}} {{.ROLE}}

  # ===========================================================================
  # Emulated cloud (Feint) — no account, no credentials. docs/emulated-cloud.md
  # ===========================================================================

  feint-up:
    desc: "Start the local Scaleway/Outscale API emulator (installs the pinned binary if absent)"
    # Task vars are NOT environment variables: without this,
    # `task feint-plan FEINT_ENDPOINT=https://api.scaleway.com` set a var the
    # script never read, the loopback guard never saw it, and the negative
    # test in docs/release-checklist.md passed without testing anything.
    env:
      FEINT_ENDPOINT: '{{.FEINT_ENDPOINT | default "http://127.0.0.1:4599"}}'
    cmds:
      - ./scripts/dev/feint.sh start

  feint-down:
    desc: "Stop the emulator and drop everything it created"
    # Task vars are NOT environment variables: without this,
    # `task feint-plan FEINT_ENDPOINT=https://api.scaleway.com` set a var the
    # script never read, the loopback guard never saw it, and the negative
    # test in docs/release-checklist.md passed without testing anything.
    env:
      FEINT_ENDPOINT: '{{.FEINT_ENDPOINT | default "http://127.0.0.1:4599"}}'
    cmds:
      - ./scripts/dev/feint.sh stop

  feint-plan:
    desc: "Plan the REAL cluster root against the emulator. Usage: task feint-plan PROVIDER=scaleway|outscale"
    vars:
      PROVIDER: '{{.PROVIDER | default "scaleway"}}'
    # Task vars are NOT environment variables: without this,
    # `task feint-plan FEINT_ENDPOINT=https://api.scaleway.com` set a var the
    # script never read, the loopback guard never saw it, and the negative
    # test in docs/release-checklist.md passed without testing anything.
    env:
      FEINT_ENDPOINT: '{{.FEINT_ENDPOINT | default "http://127.0.0.1:4599"}}'
    cmds:
      - ./scripts/dev/feint.sh plan {{.PROVIDER}}

  feint-apply:
    desc: "Full apply/destroy cycle on the reduced fixture. Usage: task feint-apply PROVIDER=scaleway|outscale"
    vars:
      PROVIDER: '{{.PROVIDER | default "scaleway"}}'
    # Task vars are NOT environment variables: without this,
    # `task feint-plan FEINT_ENDPOINT=https://api.scaleway.com` set a var the
    # script never read, the loopback guard never saw it, and the negative
    # test in docs/release-checklist.md passed without testing anything.
    env:
      FEINT_ENDPOINT: '{{.FEINT_ENDPOINT | default "http://127.0.0.1:4599"}}'
    cmds:
      - ./scripts/dev/feint.sh apply {{.PROVIDER}}

  feint-apply-root:
    desc: >-
      Untargeted apply/empty-replan/destroy on the REAL cluster root (Phase 1). Usage: task
      feint-apply-root PROVIDER=scaleway|outscale
    vars:
      PROVIDER: '{{.PROVIDER | default "scaleway"}}'
    # Task vars are NOT environment variables: without this,
    # `task feint-plan FEINT_ENDPOINT=https://api.scaleway.com` set a var the
    # script never read, the loopback guard never saw it, and the negative
    # test in docs/release-checklist.md passed without testing anything.
    env:
      FEINT_ENDPOINT: '{{.FEINT_ENDPOINT | default "http://127.0.0.1:4599"}}'
    cmds:
      - ./scripts/dev/feint.sh apply-root {{.PROVIDER}}

  feint-record:
    desc: >-
      Rank the operations our module calls that the emulator does not serve. Usage: task feint-record
      PROVIDER=scaleway|outscale
    vars:
      PROVIDER: '{{.PROVIDER | default "scaleway"}}'
    # Task vars are NOT environment variables: without this,
    # `task feint-plan FEINT_ENDPOINT=https://api.scaleway.com` set a var the
    # script never read, the loopback guard never saw it, and the negative
    # test in docs/release-checklist.md passed without testing anything.
    env:
      FEINT_ENDPOINT: '{{.FEINT_ENDPOINT | default "http://127.0.0.1:4599"}}'
    cmds:
      - ./scripts/dev/feint.sh record {{.PROVIDER}}

  feint-test:
    desc: "Both providers, both lanes (plan on the real root + apply/destroy on the fixture)"
    cmds:
      - task: feint-up
      - for: [scaleway, outscale]
        task: feint-plan
        vars: {PROVIDER: "{{.ITEM}}"}
      - for: [scaleway, outscale]
        task: feint-apply
        vars: {PROVIDER: "{{.ITEM}}"}
      - task: feint-down

  ssh-ca-check:
    desc: >-
      Bastion SSH-CA, rung "emulated" (#81): renders the shared cloud-init template and proves
      TrustedUserCAKeys/AuthorizedPrincipalsFile actually work on a real sshd in Docker. No cloud
      account. Needs Docker; skips (exit 0) if it is unavailable.
    cmds:
      - ./scripts/dev/ssh-ca-check.sh

  feint-evidence:
    desc: >-
      Capture Feint's evidence record under a machine runtime (Incus) and print what a baseline would
      pin. Needs Incus; see docs/emulated-cloud.md. Usage: task feint-evidence PROVIDER=scaleway|outscale
    vars:
      PROVIDER: '{{.PROVIDER | default "scaleway"}}'
    # Task vars are NOT environment variables: without this,
    # `task feint-plan FEINT_ENDPOINT=https://api.scaleway.com` set a var the
    # script never read, the loopback guard never saw it, and the negative
    # test in docs/release-checklist.md passed without testing anything.
    env:
      FEINT_ENDPOINT: '{{.FEINT_ENDPOINT | default "http://127.0.0.1:4599"}}'
      FEINT_VM: incus
    cmds:
      - ./scripts/dev/feint.sh start
      - ./scripts/dev/feint.sh apply {{.PROVIDER}}
      - ./scripts/dev/feint.sh evidence {{.PROVIDER}}
      - ./scripts/dev/feint.sh evidence-baseline {{.PROVIDER}}
      - ./scripts/dev/feint.sh stop

  feint-evidence-verify:
    desc: >-
      Check a freshly captured evidence record against the pinned baseline (.feint-evidence-<provider>.json).
      Usage: task feint-evidence-verify PROVIDER=scaleway|outscale
    vars:
      PROVIDER: '{{.PROVIDER | default "scaleway"}}'
    cmds:
      - ./scripts/dev/feint.sh evidence-verify {{.PROVIDER}}

  # ===========================================================================
  # Local Testing (Docker / WSL2)
  # ===========================================================================

  local-render-manifests:
    desc: "Render simplified Cilium manifest for local Docker testing (no WireGuard)"
    cmds:
      - ./scripts/bootstrap/render-bootstrap-manifests.sh --local

  local-up:
    desc: "Deploy the local Talos cluster — 3 CP + 3 workers (config + containers + bootstrap + kubeconfig)"
    vars:
      TALOS_API_PORT_BASE: '{{.TALOS_API_PORT_BASE | default "45000"}}'
      # The host side of the Kubernetes API. 6443 is the obvious choice and the
      # reason it was hardcoded — until a Hyper-V block landed on 6404-6503 and
      # the one port nobody could move turned out to be the one that collided.
      K8S_API_PORT: '{{.K8S_API_PORT | default "6443"}}'
    cmds:
      # Fail fast on a Hyper-V port reservation: Docker Desktop only reports it
      # as an opaque 500, five retries and a 90s timeout later.
      - ./scripts/dev/check-host-ports.sh {{.TALOS_API_PORT_BASE}} {{.K8S_API_PORT}}
      # Same shape, a different 90s hang: a host missing CAP_SYS_RESOURCE looks
      # healthy right up to the etcd-quorum wait. See infrastructure/opentofu-local/README.md.
      - ./scripts/dev/check-docker-talos-capability.sh
      # cilium-local.yaml is gitignored, so a fresh clone has none — render it
      # rather than boot a cluster with no CNI. Mirrors what `up` does for the
      # cloud manifest.
      - |
        CILIUM=infrastructure/opentofu/cluster/bootstrap-manifests/cilium-local.yaml
        if [ ! -s "$CILIUM" ] || grep -q "CILIUM-MANIFEST-PLACEHOLDER" "$CILIUM"; then
          ./scripts/bootstrap/render-bootstrap-manifests.sh --local
        fi
      - |
        cd infrastructure/opentofu-local
        tofu init -upgrade > /dev/null 2>&1 || tofu init > /dev/null
      - |
        # The fallback emits the sentinel the precondition in modules/talos looks
        # for. It used to emit 'placeholder', which that check does not match —
        # so a missing manifest sailed through and shipped an 11-byte inlineManifest.
        export TF_VAR_cilium_manifest="$(cat infrastructure/opentofu/cluster/bootstrap-manifests/cilium-local.yaml \
          2>/dev/null || echo 'CILIUM-MANIFEST-PLACEHOLDER')"
        tofu -chdir=infrastructure/opentofu-local apply -var talos_bootstrap=true \
          -var talos_api_port_base={{.TALOS_API_PORT_BASE}} \
            -var k8s_api_port={{.K8S_API_PORT}} -auto-approve

  local-verify:
    desc: >-
      Ask the local Docker cluster whether it is what it claims: apiserver up, every node Ready,
      Cilium on each, CoreDNS serving, no Flux, and the Talos and Kubernetes versions
      opentofu-local/variables.tf pins. Usage: task local-verify
    # The same verifier the clouds use, on its `local` path — which had no target
    # at all, so the only way to reach it was `cluster-verify PROVIDER=local`,
    # exactly the mixing the preconditions above now refuse.
    cmds:
      - ./scripts/dev/infra-verify.sh local

  local-rbac:
    desc: >-
      Ask the local Docker cluster whether Talos ENFORCES the roles in a talosconfig: an os:reader
      config is refused a host read that the admin config gets, and cannot mint itself an os:admin.
      Usage: task local-rbac
    # Rung zero for the whole scoped-credential idea. Until 2026-08-24 nobody
    # knew whether roles were enforced at all, and the answer was priced at a
    # real cloud run; it costs a container.
    cmds:
      - ./scripts/dev/test-talos-rbac.sh local

  local-test:
    desc: "Full end-to-end local test: 3 CP + 3 workers + etcd quorum + Cilium + Flux + GitOps"
    cmds:
      - ./scripts/dev/test-talos-local.sh
      # The cluster is up and credentialed at this point, so the role assertions
      # cost seconds here. A harness nobody invokes is this repository's most
      # repeated defect.
      - ./scripts/dev/test-talos-rbac.sh local

  local-status:
    desc: "Check local cluster health (3 CP + 3 workers)"
    vars:
      TALOS_API_PORT_BASE: '{{.TALOS_API_PORT_BASE | default "45000"}}'
    cmds:
      # The endpoint is derived from the same base local-up publishes. It used to
      # be hardcoded to 50000 — the container-internal port, never a host one —
      # so this whole target failed against a healthy cluster.
      - |
        export KUBECONFIG=infrastructure/opentofu-local/kubeconfig
        export TALOSCONFIG=infrastructure/opentofu-local/talosconfig
        echo "=== etcd quorum ===" && talosctl --nodes 10.5.0.10 \
          --endpoints 127.0.0.1:{{.TALOS_API_PORT_BASE}} etcd members || true
        echo "=== Kubernetes nodes ===" && kubectl get nodes -o wide || true
        echo "=== kube-system pods ===" && kubectl get pods -n kube-system || true
        echo "=== Flux Kustomizations ===" && flux get kustomizations 2>/dev/null || echo "Flux not deployed yet"
        echo "=== Flux HelmReleases ===" && flux get helmreleases -A 2>/dev/null || echo "no HelmReleases"

  local-flux:
    desc: "Port-forward Flux source-controller UI (debug) to localhost:9090"
    cmds:
      - |
        export KUBECONFIG=infrastructure/opentofu-local/kubeconfig
        echo "Flux source-controller → http://localhost:9090"
        kubectl -n flux-system port-forward svc/source-controller 9090:80

  local-down:
    desc: "Destroy local Talos cluster (containers + volumes + network + state)"
    cmds:
      # Delegate to the script's --destroy: `tofu destroy` alone can't tear the
      # cluster down (machine_secrets is prevent_destroy'd, so it errors and
      # leaves containers + state behind). --destroy also removes the containers,
      # volumes, network, and the ephemeral local state for a clean slate.
      - ./scripts/dev/test-talos-local.sh --destroy
